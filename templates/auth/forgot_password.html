<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<style>html { background: #0d0d0d; }</style>
<title>Reset Password — Clive</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: radial-gradient(circle at 50% -10%, #1a1a1a 0%, #0d0d0d 60%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        color: white;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .auth-card {
        width: 100%;
        max-width: 400px;
        background: linear-gradient(180deg, #171717 0%, #131313 100%);
        border: 1px solid #262626;
        border-radius: 22px;
        padding: 44px 34px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        animation: cardIn 0.45s ease;
    }

    @keyframes cardIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .auth-logo {
        display: flex;
        justify-content: center;
        margin-bottom: 22px;
    }
    .auth-logo img {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid #2a2a2a;
    }

    .auth-title {
        font-size: 25px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 6px;
        letter-spacing: -0.02em;
    }
    .auth-sub {
        font-size: 14px;
        color: #8a8a8a;
        text-align: center;
        margin-bottom: 30px;
        line-height: 1.5;
    }

    .auth-field {
        margin-bottom: 16px;
    }
    .auth-label {
        font-size: 13px;
        color: #ccc;
        margin-bottom: 6px;
        display: block;
        font-weight: 500;
    }
    .auth-input {
        width: 100%;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 13px 14px;
        font-size: 14.5px;
        color: #fff;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-input:focus {
        border-color: #5b9bd5;
        box-shadow: 0 0 0 3px rgba(91, 155, 213, 0.15);
    }
    .auth-input::placeholder { color: #555; }

    .auth-error {
        display: none;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #f87171;
        font-size: 13px;
        padding: 10px 14px;
        border-radius: 10px;
        margin-bottom: 16px;
        line-height: 1.4;
    }
    .auth-error.show { display: block; }

    .auth-success {
        display: none;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        color: #4ade80;
        font-size: 13px;
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 16px;
        line-height: 1.5;
    }
    .auth-success.show { display: block; }

    .auth-submit {
        width: 100%;
        background: #ffffff;
        color: #111;
        border: none;
        border-radius: 10px;
        padding: 13px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 6px;
        transition: background 0.2s, transform 0.15s;
    }
    .auth-submit:hover { background: #e8e8e8; }
    .auth-submit:active { transform: scale(0.99); }
    .auth-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .auth-switch {
        text-align: center;
        font-size: 13.5px;
        color: #888;
        margin-top: 24px;
    }
    .auth-switch a {
        color: #5b9bd5;
        text-decoration: none;
        font-weight: 500;
    }
    .auth-switch a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="auth-card">

    <div class="auth-logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Clive Logo">
    </div>

    <h1 class="auth-title">Reset your password</h1>
    <p class="auth-sub">Enter the email linked to your account and we'll send you a link to reset your password.</p>

    <div class="auth-error" id="authError"></div>
    <div class="auth-success" id="authSuccess"></div>

    <form id="resetForm">
        <div class="auth-field">
            <label class="auth-label">Email</label>
            <input type="email" class="auth-input" id="resetEmail" placeholder="you@example.com" required>
        </div>

        <button type="submit" class="auth-submit" id="resetBtn">Send Reset Link</button>
    </form>

    <p class="auth-switch">
        Remembered your password? <a href="/login">Log in</a>
    </p>

</div>

<script type="module">
    import { auth, sendPasswordResetEmail } from "{{ url_for('static', filename='js/firebase-init.js') }}";

    const form = document.getElementById('resetForm');
    const errorBox = document.getElementById('authError');
    const successBox = document.getElementById('authSuccess');
    const submitBtn = document.getElementById('resetBtn');

    function showError(message) {
        successBox.classList.remove('show');
        errorBox.textContent = message;
        errorBox.classList.add('show');
    }

    function showSuccess(message) {
        errorBox.classList.remove('show');
        successBox.textContent = message;
        successBox.classList.add('show');
    }

    function mapAuthError(error) {
        switch (error.code) {
            case 'auth/invalid-email':
                return 'Please enter a valid email address.';
            case 'auth/too-many-requests':
                return 'Too many attempts. Please try again later.';
            default:
                // Note: Firebase intentionally does NOT return "user-not-found"
                // for password reset — this prevents attackers from using this
                // form to check which emails have accounts. So most errors here
                // will be genuine issues, not "wrong email" cases.
                return 'Something went wrong. Please try again.';
        }
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorBox.classList.remove('show');
        successBox.classList.remove('show');

        const email = document.getElementById('resetEmail').value.trim();

        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        try {
            await sendPasswordResetEmail(auth, email);
            showSuccess('If an account exists for that email, a reset link has been sent. Check your inbox (and spam folder).');
            form.reset();
        } catch (error) {
            showError(mapAuthError(error));
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Reset Link';
        }
    });
</script>

</body>
</html>
