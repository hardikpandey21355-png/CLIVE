<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<style>html { background: #0d0d0d; }</style>
<title>Log In — Clive</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: radial-gradient(circle at 50% -10%, #1a1a1a 0%, #0d0d0d 60%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        color: white;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .auth-card {
        width: 100%;
        max-width: 400px;
        background: linear-gradient(180deg, #171717 0%, #131313 100%);
        border: 1px solid #262626;
        border-radius: 22px;
        padding: 44px 34px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        animation: cardIn 0.45s ease;
    }

    @keyframes cardIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .auth-logo {
        display: flex;
        justify-content: center;
        margin-bottom: 22px;
    }
    .auth-logo img {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid #2a2a2a;
    }

    .auth-title {
        font-size: 25px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 6px;
        letter-spacing: -0.02em;
    }
    .auth-sub {
        font-size: 14px;
        color: #8a8a8a;
        text-align: center;
        margin-bottom: 30px;
    }

    .auth-field {
        margin-bottom: 16px;
    }
    .auth-label {
        font-size: 13px;
        color: #ccc;
        margin-bottom: 6px;
        display: block;
        font-weight: 500;
    }
    .auth-input {
        width: 100%;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 13px 14px;
        font-size: 14.5px;
        color: #fff;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-input:focus {
        border-color: #5b9bd5;
        box-shadow: 0 0 0 3px rgba(91, 155, 213, 0.15);
    }
    .auth-input::placeholder { color: #555; }

    .auth-error {
        display: none;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #f87171;
        font-size: 13px;
        padding: 10px 14px;
        border-radius: 10px;
        margin-bottom: 16px;
        line-height: 1.4;
    }
    .auth-error.show { display: block; }

    .auth-submit {
        width: 100%;
        background: #ffffff;
        color: #111;
        border: none;
        border-radius: 10px;
        padding: 13px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 6px;
        transition: background 0.2s, transform 0.15s;
    }
    .auth-submit:hover { background: #e8e8e8; }
    .auth-submit:active { transform: scale(0.99); }
    .auth-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .auth-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 24px 0;
        color: #666;
        font-size: 12.5px;
    }
    .auth-divider::before,
    .auth-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #2a2a2a;
    }

    .auth-google {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #1a1a1a;
        color: #fff;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 12px;
        font-size: 14.5px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    .auth-google:hover {
        background: #212121;
        border-color: #444;
    }
    .auth-google:active { transform: scale(0.99); }
    .auth-google:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    .auth-google svg { width: 18px; height: 18px; flex-shrink: 0; }

    .auth-switch {
        text-align: center;
        font-size: 13.5px;
        color: #888;
        margin-top: 24px;
    }
    .auth-switch a {
        color: #5b9bd5;
        text-decoration: none;
        font-weight: 500;
    }
    .auth-switch a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="auth-card">

    <div class="auth-logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Clive Logo">
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to continue to Clive</p>

    <div class="auth-error" id="authError"></div>

    <form id="loginForm">
        <div class="auth-field">
            <label class="auth-label">Email</label>
            <input type="email" class="auth-input" id="loginEmail" placeholder="you@example.com" required>
        </div>

        <div class="auth-field">
    <label class="auth-label">Password</label>
    <input type="password" class="auth-input" id="loginPassword" placeholder="Enter your password" required>
    <p style="text-align:right; margin-top:8px;">
        <a href="/forgot-password" style="color:#5b9bd5; font-size:12.5px; text-decoration:none;">Forgot password?</a>
    </p>
</div>

<button type="submit" class="auth-submit" id="loginBtn">Log In</button>
</form>

    <div class="auth-divider">or continue with</div>

    <button type="button" class="auth-google" id="googleBtn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.87c2.27-2.09 3.58-5.17 3.58-8.82z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.28v3.11A11.997 11.997 0 0 0 12 24z"/>
            <path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28V6.61H1.28A11.997 11.997 0 0 0 0 12c0 1.94.46 3.77 1.28 5.39l3.99-3.11z"/>
            <path fill="#EA4335" d="M12 4.77c1.76 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.28 6.61l3.99 3.11C6.22 6.88 8.87 4.77 12 4.77z"/>
        </svg>
        Continue with Google
    </button>

    <p class="auth-switch">
        Don't have an account? <a href="/signup">Sign up</a>
    </p>

</div>

<script type="module">
    import {
        auth,
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup
    } from "{{ url_for('static', filename='js/firebase-init.js') }}";

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('authError');
    const submitBtn = document.getElementById('loginBtn');
    const googleBtn = document.getElementById('googleBtn');

    function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.add('show');
    }

    function clearError() {
        errorBox.classList.remove('show');
        errorBox.textContent = '';
    }

    function mapAuthError(error) {
        switch (error.code) {
            case 'auth/invalid-credential':
            case 'auth/wrong-password':
                return 'Incorrect email or password.';
            case 'auth/user-not-found':
                return 'No account found with that email.';
            case 'auth/invalid-email':
                return 'Please enter a valid email address.';
            case 'auth/too-many-requests':
                return 'Too many attempts. Please try again later.';
            case 'auth/popup-closed-by-user':
                return 'Google sign-in was cancelled.';
            case 'auth/account-exists-with-different-credential':
                return 'An account already exists with this email using a different sign-in method.';
            default:
                return 'Something went wrong. Please try again.';
        }
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearError();

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in...';

        try {
            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = '/';
        } catch (error) {
            showError(mapAuthError(error));
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log In';
        }
    });

    googleBtn.addEventListener('click', async function () {
        clearError();
        googleBtn.disabled = true;
        googleBtn.textContent = 'Connecting...';

        try {
            const provider = new GoogleAuthProvider();
            await signInWithPopup(auth, provider);
            window.location.href = '/';
        } catch (error) {
            showError(mapAuthError(error));
        } finally {
            googleBtn.disabled = false;
            googleBtn.innerHTML = `
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.87c2.27-2.09 3.58-5.17 3.58-8.82z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.28v3.11A11.997 11.997 0 0 0 12 24z"/>
                    <path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28V6.61H1.28A11.997 11.997 0 0 0 0 12c0 1.94.46 3.77 1.28 5.39l3.99-3.11z"/>
                    <path fill="#EA4335" d="M12 4.77c1.76 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.28 6.61l3.99 3.11C6.22 6.88 8.87 4.77 12 4.77z"/>
                </svg>
                Continue with Google`;
        }
    });
</script>

</body>
</html>
