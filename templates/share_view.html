<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared Chat — Clive</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #0d0d0d;
        color: #eee;
        font-family: Arial, sans-serif;
        min-height: 100vh;
    }
    .topbar {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        background: rgba(13,13,13,0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #222;
        z-index: 10;
    }
    .topbar-title {
        font-size: 15px;
        font-weight: 600;
        color: #ddd;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 60vw;
    }
    .topbar-cta {
        background: #fff;
        color: #111;
        border: none;
        border-radius: 100px;
        padding: 8px 16px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
    }
    .thread {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 20px 80px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .msg-user {
        display: flex;
        justify-content: flex-end;
    }
    .msg-user-bubble {
        background: #2a2a2a;
        border: 1px solid rgba(255,255,255,0.15);
        color: #fff;
        padding: 12px 18px;
        border-radius: 20px 20px 4px 20px;
        font-size: 15.5px;
        line-height: 1.5;
        max-width: 75%;
    }
    .msg-ai {
        font-size: 15.5px;
        line-height: 1.6;
        color: #eee;
        max-width: 85%;
    }
    .msg-ai p { margin: 0 0 8px 0; }
    .empty, .error {
        text-align: center;
        color: #777;
        padding: 80px 20px;
        font-size: 14.5px;
    }
</style>
</head>
<body data-share-id="{{ share_id }}">

<div class="topbar">
    <span class="topbar-title" id="chatTitle">Shared conversation</span>
    <a class="topbar-cta" href="/">Try Clive</a>
</div>

<div class="thread" id="thread">
    <div class="empty">Loading conversation…</div>
</div>

<script type="module">
import { db, doc, getDoc } from "{{ url_for('static', filename='js/firebase-init.js') }}";

const shareId = document.body.dataset.shareId;
const threadEl = document.getElementById('thread');
const titleEl = document.getElementById('chatTitle');

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadSharedChat() {
    try {
        const snap = await getDoc(doc(db, 'sharedChats', shareId));
        if (!snap.exists()) {
            threadEl.innerHTML = '<div class="error">This shared link doesn\'t exist or has expired.</div>';
            return;
        }
        const data = snap.data();
        const messages = data.messages || [];
        titleEl.textContent = data.title || 'Shared conversation';

        if (messages.length === 0) {
            threadEl.innerHTML = '<div class="empty">This conversation is empty.</div>';
            return;
        }

        threadEl.innerHTML = messages.map(msg => {
            if (msg.role === 'user') {
                return `<div class="msg-user"><span class="msg-user-bubble">${esc(msg.content)}</span></div>`;
            }
            const lines = String(msg.content).split('\n').filter(l => l.trim());
            const html = (lines.length ? lines : [msg.content]).map(l => `<p>${esc(l)}</p>`).join('');
            return `<div class="msg-ai">${html}</div>`;
        }).join('');
    } catch (err) {
        console.error('Failed to load shared chat:', err);
        threadEl.innerHTML = '<div class="error">Couldn\'t load this conversation.</div>';
    }
}

loadSharedChat();
</script>

</body>
</html>
