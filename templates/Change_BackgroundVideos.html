<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Videos – Clive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0a0a;
            min-height: 100vh;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* ── TOP BAR ── */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 58px;
            background: rgba(10,10,10,0.88);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            padding: 0 28px;
            z-index: 100;
            gap: 16px;
        }
        .topbar-back {
            width: 34px; height: 34px;
            border-radius: 9px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, color 0.2s;
            text-decoration: none;
        }
        .topbar-back:hover { background: rgba(255,255,255,0.12); color: white; }
        .topbar-back svg { width: 17px; height: 17px; }
        .topbar-title {
            font-size: 15px; font-weight: 600;
            color: rgba(255,255,255,0.88);
            letter-spacing: -0.01em;
        }

        /* ── PAGE ── */
        .page {
            padding: 90px 40px 60px;
            max-width: 860px;
            margin: 0 auto;
        }
        .page-heading { margin-bottom: 36px; }
        .page-heading h1 {
            font-size: 26px; font-weight: 700;
            color: white; letter-spacing: -0.02em; margin-bottom: 6px;
        }
        .page-heading p {
            font-size: 13.5px; color: rgba(255,255,255,0.38); line-height: 1.5;
        }

        /* ── SECTION LABEL ── */
        .section-label {
            display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
        }
        .section-label-text {
            font-size: 11px; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase;
            white-space: nowrap;
            color: rgba(255,255,255,0.32);
        }
        .section-label-line {
            flex: 1; height: 1px; background: rgba(255,255,255,0.07);
        }

        /* ── GRIDS ── */
        .default-grid,
        .free-grid,
        .premium-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 40px;
        }
        .premium-grid { margin-bottom: 32px; }

        /* ── CARD ── */
        .vid-card {
            display: flex; flex-direction: column; gap: 8px; cursor: pointer;
        }
        .vid-thumb {
            position: relative;
            width: 100%; aspect-ratio: 16 / 10;
            border-radius: 14px; overflow: hidden;
            background: #1b1b1d;
            border: 1.5px solid rgba(255,255,255,0.07);
            transition: border-color 0.22s, transform 0.18s, box-shadow 0.22s;
        }
        .vid-card:hover .vid-thumb {
            border-color: rgba(255,255,255,0.3);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 32px rgba(0,0,0,0.55);
        }
        .vid-card.active .vid-thumb {
            border-color: #4a9eff;
            border-width: 2px;
            box-shadow: 0 0 0 3px rgba(74,158,255,0.18);
        }

        .thumb-vid {
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.82;
            transition: opacity 0.2s;
        }
        .vid-card:hover .thumb-vid { opacity: 1; }

        /* play icon on hover */
        .play-overlay {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.25);
            opacity: 0; transition: opacity 0.2s;
            z-index: 2;
        }
        .vid-card:hover .play-overlay { opacity: 1; }
        .play-overlay svg {
            width: 24px; height: 24px; fill: white;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
        }

        /* blue tick on active card */
        .active-tick {
            position: absolute; top: 7px; right: 7px;
            width: 24px; height: 24px; border-radius: 50%;
            background: #4a9eff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 10px rgba(74,158,255,0.5);
            z-index: 4;
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.18s ease, transform 0.18s cubic-bezier(.34,1.56,.64,1);
        }
        .active-tick svg { width: 13px; height: 13px; stroke: white; stroke-width: 2.5; fill: none; }
        .vid-card.active .active-tick { opacity: 1; transform: scale(1); }

        /* card label */
        .vid-name {
            font-size: 11.5px; color: rgba(255,255,255,0.38);
            text-align: center; letter-spacing: 0.01em; transition: color 0.2s;
        }
        .vid-card:hover .vid-name  { color: rgba(255,255,255,0.72); }
        .vid-card.active .vid-name { color: #4a9eff; font-weight: 500; }

        /* ── PREMIUM CARDS (locked / blurred for free users) ── */
        .prem-thumb { border-color: rgba(255,255,255,0.05) !important; }
        .prem-card:hover .vid-thumb { border-color: rgba(255,255,255,0.2) !important; }

        .prem-fill {
            position: absolute; inset: 0;
            background: #141416;
            z-index: 0;
        }
        .prem-glass {
            position: absolute; inset: 0;
            background: rgba(255,255,255,0.015);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1;
        }

        /* When locked (free plan), force stronger blur on the video itself */
        .prem-card.locked .thumb-vid {
            filter: blur(6px);
            opacity: 0.55;
            transform: scale(1.05); /* slight zoom so blur edges don’t show */
        }
        .prem-card.locked .play-overlay {
            display: none; /* no play icon when locked */
        }
        .prem-card.locked:hover .vid-thumb {
            transform: none; /* disable lift effect when locked */
            box-shadow: none;
        }

        /* diagonal shine sweep */
        .prem-shine {
            position: absolute;
            top: -80%;
            left: -100%;
            width: 60%;
            height: 260%;
            background: linear-gradient(
                105deg,
                transparent     0%,
                transparent     35%,
                rgba(255,255,255,0.06) 45%,
                rgba(255,255,255,0.12) 50%,
                rgba(255,255,255,0.06) 55%,
                transparent     65%,
                transparent     100%
            );
            transform: skewX(-12deg);
            animation: diagShine 3.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 3;
        }

        @keyframes diagShine {
            0%   { left: -100%; }
            50%  { left: 160%;  }
            100% { left: 160%;  }
        }

        .prem-card:nth-child(1) .prem-shine { animation-delay: 0.0s; }
        .prem-card:nth-child(2) .prem-shine { animation-delay: 0.4s; }
        .prem-card:nth-child(3) .prem-shine { animation-delay: 0.8s; }
        .prem-card:nth-child(4) .prem-shine { animation-delay: 1.2s; }
        .prem-card:nth-child(5) .prem-shine { animation-delay: 1.6s; }
        .prem-card:nth-child(6) .prem-shine { animation-delay: 2.0s; }
        .prem-card:nth-child(7) .prem-shine { animation-delay: 2.4s; }
        .prem-card:nth-child(8) .prem-shine { animation-delay: 2.8s; }

        /* lock badge */
        .prem-lock {
            position: absolute; top: 7px; right: 7px;
            width: 24px; height: 24px; border-radius: 50%;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex; align-items: center; justify-content: center;
            z-index: 4;
            transition: background 0.2s, border-color 0.2s;
        }
        .prem-card:hover .prem-lock {
            background: rgba(74,158,255,0.18);
            border-color: rgba(74,158,255,0.4);
        }
        .prem-lock svg { width: 12px; height: 12px; stroke: rgba(255,255,255,0.75); stroke-width: 2; fill: none; }
        .prem-card:hover .prem-lock svg { stroke: #4a9eff; }

        /* Hide lock + glass when unlocked (premium plan) */
        .prem-card:not(.locked) .prem-lock,
        .prem-card:not(.locked) .prem-glass,
        .prem-card:not(.locked) .prem-shine {
            display: none;
        }

        /* ── UPGRADE CTA — blue ── */
        .upgrade-cta {
            display: flex; align-items: center; gap: 10px;
            padding: 15px 20px;
            background: rgba(74,158,255,0.1);
            border: 1px solid rgba(74,158,255,0.28);
            border-radius: 14px;
            color: #4a9eff;
            font-size: 14px; font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            letter-spacing: -0.01em;
            text-decoration: none;
        }
        .upgrade-cta:hover {
            background: rgba(74,158,255,0.17);
            border-color: rgba(74,158,255,0.48);
        }
        .upgrade-cta svg { width: 16px; height: 16px; fill: #4a9eff; flex-shrink: 0; }
        .upgrade-cta-chevron { margin-left: auto; font-size: 18px; opacity: 0.45; }

        /* ── TOAST ── */
        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e1e20;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px 20px;
            font-size: 13.5px; color: rgba(255,255,255,0.85);
            display: flex; align-items: center; gap: 10px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast svg { width: 16px; height: 16px; stroke: #4ade80; fill: none; flex-shrink: 0; }
        .toast.toast-lock svg { stroke: #f5a623; }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="topbar">
        <a href="/" class="topbar-back" title="Go back">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
            </svg>
        </a>
        <div class="topbar-title">Background Videos</div>
    </div>

    <div class="page">

        <div class="page-heading">
            <h1>Choose Background</h1>
            <p>Select a video that plays when Clive loads. New users always start with the Default video.</p>
        </div>

        <!-- ═══════════════════════════════ -->
        <!-- DEFAULT SECTION                 -->
        <!-- ═══════════════════════════════ -->
        <div class="section-label">
            <span class="section-label-text">Default</span>
            <span class="section-label-line"></span>
        </div>

        <div class="default-grid">
            <div class="vid-card default-card active" id="card_default" data-file="MainBackGround.mp4" onclick="pickBackground(this, 'Default')">
                <div class="vid-thumb">
                    <video class="thumb-vid" muted loop preload="metadata">
                        <source src="{{ url_for('static', filename='videos/MainBackGround.mp4') }}" type="video/mp4">
                    </video>
                    <div class="play-overlay">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="active-tick">
                        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                    </div>
                </div>
                <span class="vid-name">Default</span>
            </div>
        </div>

        <!-- ═══════════════════════════════ -->
        <!-- FREE SECTION                    -->
        <!-- ═══════════════════════════════ -->
        <div class="section-label">
            <span class="section-label-text">Free</span>
            <span class="section-label-line"></span>
        </div>

        <div class="free-grid">

            <div class="vid-card" id="card_free1" data-file="free1.mp4" onclick="pickBackground(this, 'Free 1')">
                <div class="vid-thumb">
                    <video class="thumb-vid" muted loop preload="metadata">
                        <source src="{{ url_for('static', filename='videos/free1.mp4') }}" type="video/mp4">
                    </video>
                    <div class="play-overlay">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="active-tick">
                        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                    </div>
                </div>
                <span class="vid-name">Free 1</span>
            </div>

            <div class="vid-card" id="card_free2" data-file="free2.mp4" onclick="pickBackground(this, 'Free 2')">
                <div class="vid-thumb">
                    <video class="thumb-vid" muted loop preload="metadata">
                        <source src="{{ url_for('static', filename='videos/free2.mp4') }}" type="video/mp4">
                    </video>
                    <div class="play-overlay">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="active-tick">
                        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                    </div>
                </div>
                <span class="vid-name">Free 2</span>
            </div>

        </div>

        <!-- ═══════════════════════════════ -->
        <!-- PREMIUM SECTION (always visible) -->
        <!-- ═══════════════════════════════ -->
        <div class="section-label" id="premiumSectionLabel">
            <span class="section-label-text">Premium</span>
            <span class="section-label-line"></span>
        </div>

        <div class="premium-grid" id="premiumGrid">

            <div class="vid-card prem-card locked" id="card_premium1" data-file="premium1.mp4" onclick="handlePremiumClick(this, 'Premium 1')">
                <div class="vid-thumb prem-thumb">
                    <video class="thumb-vid" muted loop preload="metadata">
                        <source src="{{ url_for('static', filename='videos/premium1.mp4') }}" type="video/mp4">
                    </video>
                    <div class="prem-glass"></div>
                    <div class="prem-shine"></div>
                    <div class="play-overlay">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="prem-lock">
                        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <div class="active-tick">
                        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                    </div>
                </div>
                <span class="vid-name">Premium 1</span>
            </div>

            <div class="vid-card prem-card locked" id="card_premium2" data-file="premium2.mp4" onclick="handlePremiumClick(this, 'Premium 2')">
                <div class="vid-thumb prem-thumb">
                    <video class="thumb-vid" muted loop preload="metadata">
                        <source src="{{ url_for('static', filename='videos/premium2.mp4') }}" type="video/mp4">
                    </video>
                    <div class="prem-glass"></div>
                    <div class="prem-shine"></div>
                    <div class="play-overlay">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="prem-lock">
                        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <div class="active-tick">
                        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                    </div>
                </div>
                <span class="vid-name">Premium 2</span>
            </div>

            <div class="vid-card prem-card locked" id="card_premium3" data-file="premium3.mp4" onclick="handlePremiumClick(this, 'Premium 3')">
                <div class="vid-thumb prem-thumb">
                    <video class="thumb-vid" muted loop preload="metadata">
                        <source src="{{ url_for('static', filename='videos/premium3.mp4') }}" type="video/mp4">
                    </video>
                    <div class="prem-glass"></div>
                    <div class="prem-shine"></div>
                    <div class="play-overlay">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="prem-lock">
                        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <div class="active-tick">
                        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                    </div>
                </div>
                <span class="vid-name">Premium 3</span>
            </div>

            <div class="vid-card prem-card locked" id="card_premium4" data-file="premium4.mp4" onclick="handlePremiumClick(this, 'Premium 4')">
                <div class="vid-thumb prem-thumb">
                    <video class="thumb-vid" muted loop preload="metadata">
                        <source src="{{ url_for('static', filename='videos/premium4.mp4') }}" type="video/mp4">
                    </video>
                    <div class="prem-glass"></div>
                    <div class="prem-shine"></div>
                    <div class="play-overlay">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="prem-lock">
                        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <div class="active-tick">
                        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                    </div>
                </div>
                <span class="vid-name">Premium 4</span>
            </div>

        </div>

        <!-- Upgrade CTA -->
        <a class="upgrade-cta" href="/upgrade">
            <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            Unlock all Premium backgrounds — Upgrade your plan
            <span class="upgrade-cta-chevron">›</span>
        </a>

    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <svg viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
        </svg>
        <span id="toast-text">Background selected</span>
    </div>

    <script>
        /* ── Hover: play/pause thumbnail (visual only) ── */
        document.querySelectorAll('.vid-card').forEach(card => {
            const video = card.querySelector('.thumb-vid');
            if (!video) return;
            card.addEventListener('mouseenter', () => {
                // Only play if not locked
                if (!card.classList.contains('locked')) {
                    video.play().catch(() => {});
                }
            });
            card.addEventListener('mouseleave', () => {
                video.pause();
                video.currentTime = 0;
            });
        });

        /* ── Storage key ── */
        const BG_STORAGE_KEY = 'clive_bg_video_choice';
        const DEFAULT_FILE = 'MainBackGround.mp4';

        /* ── Pick a background ── */
        function pickBackground(cardEl, label) {
            // Never allow selecting a locked premium card
            if (cardEl.classList.contains('locked')) {
                showToast('Upgrade to unlock this background', true);
                return;
            }

            document.querySelectorAll('.vid-card').forEach(c => c.classList.remove('active'));
            cardEl.classList.add('active');

            const file = cardEl.dataset.file;
            if (file) {
                const previous = localStorage.getItem(BG_STORAGE_KEY);
                localStorage.setItem(BG_STORAGE_KEY, file);

                if (previous !== file) {
                    sessionStorage.removeItem('clive_bg_video_played');
                }
            }

            showToast(label + ' selected', false);
        }

        /* ── Premium click handler (works for both free & premium users) ── */
        function handlePremiumClick(cardEl, label) {
            if (cardEl.classList.contains('locked')) {
                showToast('Upgrade to unlock this background', true);
            } else {
                pickBackground(cardEl, label);
            }
        }

        /* ── Restore active card — new users always get Default ── */
        function restoreSavedBackground() {
            let saved = localStorage.getItem(BG_STORAGE_KEY);

            // New user / no choice yet → force Default
            if (!saved) {
                localStorage.setItem(BG_STORAGE_KEY, DEFAULT_FILE);
                saved = DEFAULT_FILE;
            }

            // If saved file points to a locked premium card, fall back to Default
            const match = document.querySelector(`.vid-card[data-file="${saved}"]`);
            if (!match || match.classList.contains('locked')) {
                localStorage.setItem(BG_STORAGE_KEY, DEFAULT_FILE);
                saved = DEFAULT_FILE;
            }

            document.querySelectorAll('.vid-card').forEach(c => c.classList.remove('active'));
            const finalCard = document.querySelector(`.vid-card[data-file="${saved}"]`) || document.getElementById('card_default');
            if (finalCard) finalCard.classList.add('active');
        }

        /* ── Toast ── */
        function showToast(message, isLock) {
            const t = document.getElementById('toast');
            document.getElementById('toast-text').textContent = message;
            t.classList.toggle('toast-lock', !!isLock);
            t.classList.add('show');
            clearTimeout(t._hideTimer);
            t._hideTimer = setTimeout(() => t.classList.remove('show'), 2800);
        }

        // Run restore early (cards start locked; plan check will unlock later)
        restoreSavedBackground();
    </script>

    <script type="module">
        import { auth, onAuthStateChanged, db, doc, getDoc } from "{{ url_for('static', filename='js/firebase-init.js') }}";

        onAuthStateChanged(auth, async (user) => {
            let plan = 'free';
            if (user) {
                try {
                    const snap = await getDoc(doc(db, 'users', user.uid));
                    plan = snap.exists() ? (snap.data().selectedPlan || 'free') : 'free';
                } catch (err) {
                    console.error('Failed to load plan for background videos:', err);
                }
            }

            const premiumCards = document.querySelectorAll('.prem-card');

            if (plan === 'free') {
                // Keep premium visible but locked + blurred
                premiumCards.forEach(card => {
                    card.classList.add('locked');
                });
            } else {
                // Unlock for premium users
                premiumCards.forEach(card => {
                    card.classList.remove('locked');
                });
            }

            // Re-run restore after plan is known (in case a premium was previously selected)
            restoreSavedBackground();
        });
    </script>

</body>
</html>
