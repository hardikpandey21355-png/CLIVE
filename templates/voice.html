<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Interface</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #111;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .canvas-container {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    overflow: visible;
    transition: bottom 0.75s cubic-bezier(0.65,0,0.35,1),
                width  0.75s cubic-bezier(0.65,0,0.35,1),
                height 0.75s cubic-bezier(0.65,0,0.35,1),
                top    0.75s cubic-bezier(0.65,0,0.35,1),
                margin 0.75s cubic-bezier(0.65,0,0.35,1);
    top: 50%;
    margin-top: -130px;
    width: 260px;
    height: 260px;
  }
  .canvas-container.mic-active {
    top: auto;
    margin-top: 0;
    bottom: 120px;
    width: 96px;
    height: 96px;
  }
  canvas { width: 100%; height: 100%; display: block; }

  /* Small status label under the ball — state only, never transcript text */
  .status-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    margin-top: 165px;
    font-size: 0.85rem;
    font-weight: 400;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.02em;
    pointer-events: none;
    transition: opacity 0.3s ease;
    opacity: 0;
    white-space: nowrap;
  }
  .status-label.show { opacity: 1; }

  .bottom-controls {
    position: absolute;
    bottom: 34px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    z-index: 10;
  }
  .control-btn {
    width: 54px; height: 54px;
    border-radius: 50%; border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.3s ease, transform 0.2s ease;
    background: rgba(255,255,255,0.09);
    backdrop-filter: blur(12px);
  }
  .control-btn:hover { background: rgba(255,255,255,0.16); transform: scale(1.07); }
  .mic-btn.active { background: rgba(239,68,68,0.22); }
  .mic-btn.active .mic-icon { fill: #ef4444; }
  .mic-icon { width: 21px; height: 21px; fill: rgba(255,255,255,0.9); transition: fill 0.3s ease; }
  .close-icon { width: 17px; height: 17px; stroke: rgba(255,255,255,0.7); stroke-width: 2; fill: none; stroke-linecap: round; }


.voice-progress-popup{
    position: fixed;
    top: 20px;
    left: 20px;

    z-index: 99999;

    display: flex;
    align-items: center;
    gap: 14px;

    width: 320px;
    padding: 16px 18px;

    background: rgba(20,20,20,.92);
    backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;

    color: white;

    box-shadow: 0 10px 35px rgba(0,0,0,.35);

    animation: slideIn .45s ease;
}

.voice-progress-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#00d26a;

    animation:pulse 1.8s infinite;
}

.voice-progress-popup h3{
    margin:0;
    font-size:16px;
    font-weight:600;
}

.voice-progress-popup p{
    margin-top:4px;
    font-size:14px;
    color:#bfbfbf;
    line-height:1.4;
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateY(-20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes pulse{
    0%{
        box-shadow:0 0 0 0 rgba(0,210,106,.7);
    }
    70%{
        box-shadow:0 0 0 10px rgba(0,210,106,0);
    }
    100%{
        box-shadow:0 0 0 0 rgba(0,210,106,0);
    }
}
.fade-out{
    animation:fadeOut .4s forwards;
}

.fade-in{
    animation:fadeIn .4s forwards;
}

@keyframes fadeOut{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-5px);
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


.voice-timer {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 99999;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(20,20,20,.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 100px;
    padding: 8px 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.voice-timer-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ef4444;
    animation: voiceTimerPulse 1.2s infinite;
}
@keyframes voiceTimerPulse {
    0% { box-shadow: 0 0 0 0 rgba(239,68,68,.6); }
    70% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
}
.voice-limit-toast {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 99999;
    display: none;
    align-items: center;
    gap: 10px;
    background: #3a1414;
    border: 1px solid rgba(239,68,68,.5);
    color: #fca5a5;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
}
.voice-limit-toast svg { width: 18px; height: 18px; stroke: #f87171; flex-shrink: 0; }
.voice-limit-toast.show { display: flex; }
</style>
</head>
<body>

<div class="canvas-container" id="canvasContainer">
  <canvas id="c"></canvas>
</div>

<div class="voice-timer" id="voiceTimer" style="display:none;">
    <span class="voice-timer-dot"></span>
    <span id="voiceTimerText">1:00</span>
</div>

<div class="voice-limit-toast" id="voiceLimitToast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>Your daily limit has reached out</span>
</div>

<div class="status-label" id="statusLabel"></div>

<!-- mic LEFT, cancel RIGHT -->
<div class="bottom-controls">
  <button class="control-btn mic-btn" id="micBtn" onclick="toggleMic()">
    <svg class="mic-icon" id="micIcon" viewBox="0 0 24 24">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
      <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
  </button>
  <button class="control-btn" onclick="window.history.back()">
    <svg class="close-icon" viewBox="0 0 24 24">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>

<div class="voice-progress-popup">
    <span class="voice-progress-dot"></span>

    <div>
        <h3>Voice Mode</h3>
        <p id="voice-status">The Voice Mode is still in progress.</p>
    </div>
</div>

<script>
const popup = document.querySelector(".voice-progress-popup");
const status = document.getElementById("voice-status");

// Change the text after 2.5 seconds
setTimeout(() => {

    status.classList.add("fade-out");

    setTimeout(() => {
        status.textContent = "It may not function properly.";
        status.classList.remove("fade-out");
        status.classList.add("fade-in");
    }, 400);

}, 2500);

// Hide the popup after 5 seconds
setTimeout(() => {

    popup.style.transition = "all .4s ease";
    popup.style.opacity = "0";
    popup.style.transform = "translateX(-20px)";

    setTimeout(() => {
        popup.remove();
    }, 400);

}, 5000);
</script>

<script>
/* ══════════════════════════════════════
   CANVAS
══════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const SIZE   = 640;
canvas.width = canvas.height = SIZE;
const CX = SIZE / 2, CY = SIZE / 2;
const BALL_R       = 265;
const REPEL_R      = 140;
const REPEL_FORCE  = 22;

let smoothEnergy = 0;
let isMicActive  = false;
window.getIsMicActive = () => isMicActive;
let globalAngle  = 0;

const mouse = { x: -9999, y: -9999 };
const cont  = document.getElementById('canvasContainer');

function toCanvasMouse(ex, ey) {
  const r = cont.getBoundingClientRect();
  mouse.x = (ex - r.left) * (SIZE / r.width);
  mouse.y = (ey - r.top)  * (SIZE / r.height);
}
window.addEventListener('mousemove', e => toCanvasMouse(e.clientX, e.clientY));
window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

const NUM_DOTS = 2600;

const dots = Array.from({ length: NUM_DOTS }, () => {
  const r  = Math.sqrt(Math.random()) * BALL_R * 0.95;
  const a0 = Math.random() * Math.PI * 2;
  return {
    r, a0,
    speedMul: 0.85 + Math.random() * 0.3,
    wobbleR:  1.5 + Math.random() * 4,
    wobbleS:  0.4 + Math.random() * 0.8,
    wobbleP:  Math.random() * Math.PI * 2,
    size:  0.6 + Math.random() * 1.0,
    alpha: 0.72 + Math.random() * 0.28,
    ox: 0, oy: 0,
    x: 0, y: 0,
  };
});

function updateDots(energy) {
  const t = performance.now() * 0.001;

  for (const d of dots) {
    const angle = d.a0 + globalAngle * d.speedMul;

    const wx = Math.cos(d.wobbleP + t * d.wobbleS) * d.wobbleR * (1 + energy * 3);
    const wy = Math.sin(d.wobbleP + t * d.wobbleS * 1.3) * d.wobbleR * (1 + energy * 3);

    const bx = CX + d.r * Math.cos(angle) + wx;
    const by = CY + d.r * Math.sin(angle) + wy;

    const dx = bx + d.ox - mouse.x;
    const dy = by + d.oy - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < REPEL_R && dist > 0) {
      const force = (1 - dist / REPEL_R) * REPEL_FORCE;
      d.ox += (dx / dist) * force;
      d.oy += (dy / dist) * force;
    }
    d.ox *= 0.87;
    d.oy *= 0.87;

    d.x = bx + d.ox;
    d.y = by + d.oy;
  }
}

function drawDots(energy) {
  ctx.clearRect(0, 0, SIZE, SIZE);

  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, BALL_R, 0, Math.PI * 2);
  ctx.clip();

  for (const d of dots) {
    const dist = Math.sqrt((d.x - CX) ** 2 + (d.y - CY) ** 2);
    const edgeFade = Math.max(0, 1 - dist / (BALL_R * 0.97));
    const fade = Math.pow(edgeFade, 0.35);

    const centerProx = 1 - (d.r / BALL_R);
    const pulse = 1 + energy * centerProx * 3.5;

    const sz = d.size * (0.9 + pulse * 0.3);
    const al = Math.min(1, d.alpha * fade * (0.9 + energy * 0.4));

    ctx.beginPath();
    ctx.arc(d.x, d.y, sz, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${al})`;
    ctx.fill();
  }

  ctx.restore();
}

/* ══════════════════════════════════════
   METEOR DOTS
══════════════════════════════════════ */
const MAX_METEORS  = 18;
const meteors = [];

function spawnMeteor() {
  const angle   = Math.random() * Math.PI * 2;
  const startR  = BALL_R * (1.15 + Math.random() * 0.35);
  const targetR = BALL_R * (0.05 + Math.random() * 0.55);
  meteors.push({
    angle, r: startR, targetR,
    speed:   0.4 + Math.random() * 0.9,
    size:    0.5 + Math.random() * 0.8,
    alpha:   0,
    done:    false,
  });
}
for (let i = 0; i < MAX_METEORS; i++) spawnMeteor();

function updateMeteors() {
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.r -= m.speed;
    if (m.r < BALL_R) m.alpha = Math.min(0.85, m.alpha + 0.04);
    if (m.r <= m.targetR) {
      meteors.splice(i, 1);
      spawnMeteor();
    }
  }
  while (meteors.length < MAX_METEORS) spawnMeteor();
}

function drawMeteors() {
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, BALL_R, 0, Math.PI * 2);
  ctx.clip();

  for (const m of meteors) {
    if (m.r >= BALL_R) continue;
    const x = CX + m.r * Math.cos(m.angle);
    const y = CY + m.r * Math.sin(m.angle);
    ctx.beginPath();
    ctx.arc(x, y, m.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${m.alpha})`;
    ctx.fill();
  }

  ctx.restore();
}

/* ══════════════════════════════════════
   AUDIO (mic → analyser, for the listening pulse)
══════════════════════════════════════ */
let audioCtx, analyser, micStream, dataArr;

async function startMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser  = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    dataArr   = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);
    startSpeechRecognition();
    setStatus('listening');
  } catch(e) {
    isMicActive = false;
    resetMicUI();
  }
}

function stopMic() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx)  audioCtx.close();
  analyser = null;
  stopSpeechRecognition();
  setStatus('');
}

function getRawEnergy() {
  if (!analyser) return 0;
  analyser.getByteFrequencyData(dataArr);
  let s = 0;
  for (let i = 0; i < dataArr.length; i++) s += dataArr[i];
  return Math.min(1, (s / dataArr.length) / 75);
}

/* ══════════════════════════════════════
   STATUS LABEL — state word only, never transcript text
══════════════════════════════════════ */
const statusEl = document.getElementById('statusLabel');
function setStatus(state) {
  const labels = {
    listening: 'Listening…',
    thinking:  'Thinking…',
    speaking:  'Speaking…',
    ''      :  ''
  };
  const text = labels[state] ?? '';
  statusEl.textContent = text;
  statusEl.classList.toggle('show', !!text);
}

/* ══════════════════════════════════════
   AI STATE
══════════════════════════════════════ */
let isAISpeaking    = false;   // true while Fish Audio playback is active
let currentAudio    = null;    // the Audio object Clive is speaking through
let aiEnergy         = 0;

function getAIEnergy() {
  return 0.25
    + Math.sin(performance.now() * 0.003) * 0.15
    + Math.sin(performance.now() * 0.007) * 0.08;
}

/* Stop AI mid-sentence — called when user starts speaking again */
function interruptAI() {
  if (!isAISpeaking) return;
  window.speechSynthesis.cancel(); // in case the fallback voice is mid-sentence
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.src = '';
    currentAudio = null;
  }
  isAISpeaking = false;
  setStatus(isMicActive ? 'listening' : '');
}

/* ══════════════════════════════════════
   DRAW LOOP
══════════════════════════════════════ */
function draw() {
  requestAnimationFrame(draw);

  let energy;
  if (isAISpeaking) {
    const target = getAIEnergy();
    smoothEnergy += (target - smoothEnergy) * 0.08;
    energy = smoothEnergy;
  } else {
    const raw = getRawEnergy();
    smoothEnergy += raw > smoothEnergy
      ? (raw - smoothEnergy) * 0.22
      : (raw - smoothEnergy) * 0.06;
    energy = smoothEnergy;
  }

  globalAngle += 0.00028 + energy * 0.0018;
  updateDots(energy);
  drawDots(energy);
  updateMeteors();
  drawMeteors();
}
draw();

/* ══════════════════════════════════════
   SPEAK A REPLY — via Fish Audio backend
   ─────────────────────────────────────
   Falls back to the browser's built-in speech synthesis only if the
   backend call fails (no key set, network issue, etc.) so the voice
   never goes completely silent.
══════════════════════════════════════ */
function speakWithBrowserFallback(text) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis) { resolve(); return; }

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1;
    utterance.pitch = 1;

    utterance.onstart = () => { isAISpeaking = true; setStatus('speaking'); };
    utterance.onend = () => {
      isAISpeaking = false;
      setStatus(isMicActive ? 'listening' : '');
      resolve();
    };
    utterance.onerror = () => {
      isAISpeaking = false;
      setStatus(isMicActive ? 'listening' : '');
      resolve();
    };

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  });
}

async function speakReply(text) {
  try {
    const audioRes = await fetch('/voice/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });

    if (!audioRes.ok) throw new Error('TTS request failed');

    const blob   = await audioRes.blob();
    const url    = URL.createObjectURL(blob);
    const audio  = new Audio(url);
    currentAudio = audio;

    await new Promise((resolve) => {
      audio.onplay = () => { isAISpeaking = true; setStatus('speaking'); };
      audio.onended = () => {
        isAISpeaking = false;
        currentAudio = null;
        setStatus(isMicActive ? 'listening' : '');
        URL.revokeObjectURL(url);
        resolve();
      };
      audio.onerror = () => {
        isAISpeaking = false;
        currentAudio = null;
        setStatus(isMicActive ? 'listening' : '');
        resolve();
      };
      audio.play();
    });
  } catch (err) {
    console.error('[Fish Audio speak failed, using browser fallback]', err);
    await speakWithBrowserFallback(text);
  }
}

/* ══════════════════════════════════════
   SOUND + AI TRIGGER — real backend chat
══════════════════════════════════════ */
let isWaitingForAI = false;

async function triggerAI(userText) {
  if (isWaitingForAI || !userText.trim()) return;
  isWaitingForAI = true;

  /* 1 — Play soft notice sound */
  try {
    const notify = new Audio('/static/sounds/soft_notice.mp3');
    await new Promise(res => { notify.onended = res; notify.onerror = res; notify.play(); });
  } catch(_) {}

  /* 2 — "Thinking" state while Clive actually processes the message */
  setStatus('thinking');

  let reply;
  try {
    const res  = await fetch('/voice/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: userText })
    });
    const data = await res.json();
    reply = data.reply || "Sorry, I didn't catch that.";
  } catch (err) {
    console.error('[voice/chat failed]', err);
    reply = "Sorry, I couldn't reach the server just now.";
  }

  /* 3 — Speak it out loud via Fish Audio (falls back to browser TTS on failure) */
  await speakReply(reply);

  isWaitingForAI = false;
}

/* ══════════════════════════════════════
   SPEECH RECOGNITION
══════════════════════════════════════ */
let recognition  = null;
let silenceTimer = null;
const SILENCE_MS = 2000;

function startSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;

  recognition = new SR();
  recognition.continuous     = true;
  recognition.interimResults = true;
  recognition.lang           = 'en-US';

  let finalTranscript = '';

  recognition.onresult = (event) => {
    if (isAISpeaking) interruptAI();

    clearTimeout(silenceTimer);

    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        finalTranscript += event.results[i][0].transcript + ' ';
      } else {
        interim += event.results[i][0].transcript;
      }
    }

    setStatus('listening'); // no transcript text is ever shown, just the state

    silenceTimer = setTimeout(() => {
      const toSend = finalTranscript.trim() || interim.trim();
      finalTranscript = '';
      if (toSend) triggerAI(toSend);
    }, SILENCE_MS);
  };

  recognition.onerror = (e) => {
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      finalTranscript = '';
    }
  };

  recognition.onend = () => {
    clearTimeout(silenceTimer);
    if (isMicActive) {
      try { recognition.start(); } catch(_) {}
    }
  };

  recognition.start();
}

function stopSpeechRecognition() {
  clearTimeout(silenceTimer);
  interruptAI();
  if (recognition) { recognition.onend = null; recognition.stop(); recognition = null; }
}

/* ══════════════════════════════════════
   MIC TOGGLE
══════════════════════════════════════ */
function resetMicUI() {
  document.getElementById('micBtn').classList.remove('active');
  document.getElementById('micIcon').innerHTML = `
    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>`;
  document.getElementById('canvasContainer').classList.remove('mic-active');
}

function toggleMic() {
  if (!isMicActive && window.isVoiceLimitReached && window.isVoiceLimitReached()) {
    if (window.showVoiceLimitToastNow) window.showVoiceLimitToastNow();
    return;
  }

  isMicActive = !isMicActive;
  const btn  = document.getElementById('micBtn');
  const icon = document.getElementById('micIcon');
  const wrap = document.getElementById('canvasContainer');

  if (isMicActive) {
    if (window.startVoiceTimer && window.startVoiceTimer() === false) {
      isMicActive = false;
      return;
    }
    btn.classList.add('active');
    icon.innerHTML = `<path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.08c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>`;
    wrap.classList.add('mic-active');
    startMic();
  } else {
    if (window.stopVoiceTimer) window.stopVoiceTimer();
    resetMicUI();
    stopMic();
  }
}
window.toggleMic = toggleMic;
</script>



<script type="module">
import { auth, onAuthStateChanged, db, doc, getDoc, setDoc } from "{{ url_for('static', filename='js/firebase-init.js') }}";

const VOICE_DAILY_LIMIT_SECONDS = 60;
const PAID_VOICE_DAILY_LIMIT_SECONDS = 420; // 7 minutes
let currentUser = null;
let currentPlan = 'free';
let voiceUsageCache = null;
let voiceTimerInterval = null;
let limitReached = false;

function getVoiceLimitSeconds() {
    return currentPlan === 'free' ? VOICE_DAILY_LIMIT_SECONDS : PAID_VOICE_DAILY_LIMIT_SECONDS;
}

function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatTime(totalSeconds) {
    const s = Math.max(0, Math.round(totalSeconds));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${String(sec).padStart(2,'0')}`;
}

onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    if (!user) return;
    try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        const data = snap.exists() ? snap.data() : {};
        currentPlan = data.selectedPlan || 'free';

        const usage = data.voiceUsage;
        voiceUsageCache = (usage && usage.date === todayStr())
            ? { date: usage.date, seconds: usage.seconds }
            : { date: todayStr(), seconds: 0 };

        if (voiceUsageCache.seconds >= getVoiceLimitSeconds()) {
            limitReached = true;
        }
    } catch (err) {
        console.error('Failed to load voice plan/usage:', err);
        currentPlan = 'free';
        voiceUsageCache = { date: todayStr(), seconds: 0 };
    }
});

function updateVoiceTimerDisplay() {
    const remaining = getVoiceLimitSeconds() - voiceUsageCache.seconds;
    document.getElementById('voiceTimerText').textContent = formatTime(remaining);
}

function showVoiceLimitToast() {
    const toast = document.getElementById('voiceLimitToast');
    toast.classList.add('show');
    clearTimeout(toast._hideTimer);
    toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 4000);
}
window.showVoiceLimitToastNow = showVoiceLimitToast;

async function saveVoiceUsage() {
    if (!currentUser || !voiceUsageCache) return;
    try {
        await setDoc(doc(db, 'users', currentUser.uid), {
            voiceUsage: { date: voiceUsageCache.date, seconds: voiceUsageCache.seconds }
        }, { merge: true });
    } catch (err) {
        console.error('Failed to save voice usage:', err);
    }
}

window.isVoiceLimitReached = function() {
    return limitReached;
};

// Called right when mic turns ON. Returns false if it should NOT start.
window.startVoiceTimer = function() {
    if (!voiceUsageCache || voiceUsageCache.date !== todayStr()) {
        voiceUsageCache = { date: todayStr(), seconds: 0 };
        limitReached = false;
    }

    const limitSeconds = getVoiceLimitSeconds();

    if (voiceUsageCache.seconds >= limitSeconds) {
        limitReached = true;
        showVoiceLimitToast();
        return false;
    }

    document.getElementById('voiceTimer').style.display = 'flex';
    updateVoiceTimerDisplay();

    clearInterval(voiceTimerInterval);
    voiceTimerInterval = setInterval(() => {
        voiceUsageCache.seconds += 1;
        updateVoiceTimerDisplay();

        if (voiceUsageCache.seconds % 5 === 0) saveVoiceUsage();

        if (voiceUsageCache.seconds >= limitSeconds) {
            limitReached = true;
            saveVoiceUsage();
            showVoiceLimitToast();
            clearInterval(voiceTimerInterval);
            if (window.getIsMicActive && window.getIsMicActive()) window.toggleMic();
        }
    }, 1000);

    return true;
};

// Called right when mic turns OFF
window.stopVoiceTimer = function() {
    clearInterval(voiceTimerInterval);
    document.getElementById('voiceTimer').style.display = 'none';
    saveVoiceUsage();
};
</script>
