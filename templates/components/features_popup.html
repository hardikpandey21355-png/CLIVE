<style>
/*=======================================================================*/
.features-btn {
    position: fixed;
    top: 18px;
    right: 240px;
    z-index: 9999;
    background-color: transparent;
    color: #ffffff;
    border: none;
    border-radius: 50px;
    padding: 8px 13px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.3px;
}
.features-btn:hover {
    background-color: #000000a1;
}
.features-btn:active {
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
}
/*=======================================================================*/


/*=======================================================================*/
.features-popup {
    position: fixed;
    top: 55px;
    right: 175px;
    width: 190px;
    background: #2d2d2d;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 8px 6px;
    z-index: 9999;
    display: none;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    animation: featuresSlideDown 0.2s ease-out;
    max-height: 80vh;
    overflow-y: auto;
    scrollbar-width: none;
}
.features-popup::-webkit-scrollbar {
    display: none;
}
.features-popup.show {
    display: block;
}
@keyframes featuresSlideDown {
    from {
        opacity: 0;
        transform: translateY(-6px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.features-section-heading {
    font-size: 11px;
    color: #888;
    padding: 6px 10px 4px;
    font-family: Arial, sans-serif;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    font-weight: 600;
}
.features-item {
    padding: 6px 14px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.75);
    font-family: Arial, sans-serif;
    border-radius: 6px;
    cursor: default;
    user-select: none;
    pointer-events: none;
}
.features-divider {
    border: none;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    margin: 6px 4px;
}
/*=======================================================================*/
</style>


<script>
/*=======================================================================*/
let featuresCloseTimer;
function openFeaturesPopup() {
    clearTimeout(featuresCloseTimer);
    document.getElementById('features-popup').classList.add('show');
}
function scheduleFeatureClose() {
    featuresCloseTimer = setTimeout(() => {
        document.getElementById('features-popup').classList.remove('show');
    }, 200);
}
/*=======================================================================*/
</script>
