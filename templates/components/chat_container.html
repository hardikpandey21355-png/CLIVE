<!-- ============================== JS BEHAVIOR ============================== -->
<script>
// Reusable smooth-curve SVG icons (rounded caps/joins, no sharp corners)
const ICONS = {
    copy: `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`,
    check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
    thumbsUp: `<svg viewBox="0 0 24 24"><path d="M7 10v12"></path><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"></path></svg>`,
    thumbsDown: `<svg viewBox="0 0 24 24"><path d="M17 14V2"></path><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22h0a3.13 3.13 0 0 1-3-3.88Z"></path></svg>`,
    redo: `<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>`
};

// True whenever a confirmed non-free plan has loaded — set elsewhere as
// window.currentUserPlan; defaults safely to "free" behavior otherwise.
function isPaidPlan() {
    return !!(window.currentUserPlan && window.currentUserPlan !== 'free');
}

// ── Message bubble color, set from Settings → Color Messages ──
const BUBBLE_COLOR_KEY = 'clive_message_bubble_color';

function applyBubbleColor(bubbleEl) {
    const savedColor = localStorage.getItem(BUBBLE_COLOR_KEY);
    if (!savedColor) return;
    bubbleEl.style.background = savedColor;
    bubbleEl.style.border = (savedColor === '#2a2a2a')
        ? '1px solid rgba(255,255,255,0.15)'
        : 'none';
}

function escapeHtmlForCode(str) {
    return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

// Escapes HTML, then converts **bold** into <strong>, `code` into <code>,
// markdown [text](url) links, and bare http(s) URLs into clickable <a> tags.
// Paid plans get a boxed "chip" link style instead of a plain underlined link.
function parseInlineMarkdown(text) {
    const escaped = escapeHtmlForCode(text);
    const paid = isPaidPlan();
    const linkClass = paid ? 'ai-link ai-link-boxed' : 'ai-link';
    const linkIcon = paid
        ? '<svg class="ai-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
        : '';
    return escaped
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+?)`/g, '<code class="ai-inline-code">$1</code>')
        // markdown-style links: [label](https://example.com)
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener noreferrer" class="' + linkClass + '">' + linkIcon + '<span>$1</span></a>')
        // bare URLs not already inside an href="" we just created
        .replace(/(^|[^"'>])(https?:\/\/[^\s<]+)/g, function (_, prefix, url) {
            let trail = '';
            const trailMatch = url.match(/[.,!?;:)\]]+$/);
            if (trailMatch) {
                trail = trailMatch[0];
                url = url.slice(0, -trail.length);
            }
            return prefix + '<a href="' + url + '" target="_blank" rel="noopener noreferrer" class="' + linkClass + '">' + linkIcon + '<span>' + url + '</span></a>' + trail;
        });
}
// Lightweight, dependency-free syntax coloring for paid plans — highlights
// keywords, strings, numbers, and line comments. Not a full parser, just
// enough regex-based coloring to make code visually distinct.
// Single-pass tokenizer — avoids the "double-tagging" bug you'd get from
// running several separate regex replaces one after another (later passes
// can accidentally match text inside spans the earlier passes just inserted).
const CODE_TOKEN_REGEX = /(#.*|\/\/.*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(function|const|let|var|return|if|else|for|while|class|import|from|export|def|self|new|async|await|try|catch|except|finally|switch|case|break|continue|null|true|false|None|True|False|public|private|static|void|int|str|float|bool)\b|\b([A-Za-z_]\w*)(?=\()|\b(\d+\.?\d*)\b|([+\-*/%=<>!&|^~]{1,3})/g;

function highlightCode(code) {
    const escaped = escapeHtmlForCode(code);
    return escaped.replace(CODE_TOKEN_REGEX, function (match, comment, str, keyword, func, num, op) {
        if (comment) return '<span class="code-comment">' + comment + '</span>';
        if (str)     return '<span class="code-string">' + str + '</span>';
        if (keyword) return '<span class="code-keyword">' + keyword + '</span>';
        if (func)    return '<span class="code-func">' + func + '</span>';
        if (num)     return '<span class="code-number">' + num + '</span>';
        if (op)      return '<span class="code-op">' + op + '</span>';
        return match;
    });
}

// Very small sanitizer for AI-generated SVG diagrams (paid plan only) —
// strips <script> tags and inline event-handler attributes before the SVG
// is inserted into the DOM. Falls back to plain escaped text if the block
// doesn't actually start with <svg, so nothing gets rendered blindly.
function sanitizeSvgForDisplay(raw) {
    let svg = raw.trim();
    if (!/^<svg[\s>]/i.test(svg)) {
        return '<pre class="ai-code-content"><code>' + escapeHtmlForCode(svg) + '</code></pre>';
    }
    svg = svg.replace(/<script[\s\S]*?<\/script>/gi, '');
    svg = svg.replace(/\son\w+\s*=\s*(".*?"|'.*?')/gi, '');
    svg = svg.replace(/\son\w+\s*=\s*[^\s>]+/gi, '');
    return svg;
}
// Parses AI response text for fenced code blocks (```lang ... ```) and
// renders each one as a boxed code card with a header + copy button.
// Everything outside a fence is rendered as normal paragraphs, same as before.
function renderAIContent(container, text) {
    const codeBlockRegex = /```(\w*)\n?([\s\S]*?)```/g;
    let lastIndex = 0;
    let match;
    let blockIndex = 0;
    let hasContent = false;

    function appendTextSegment(segment) {
        const lines = segment.split('\n').filter(l => l.trim());
        let currentList = null; // holds an open <ul> while consecutive bullet lines are found

        lines.forEach(line => {
            // Skip stray setext-style heading underlines (rows of === or ---)
            // in case the model still slips one in despite the instruction.
            if (/^[=\-_]{3,}$/.test(line.trim())) return;

            const headingMatch = line.match(/^#{1,3}\s+(.*)/);
            const bulletMatch = line.match(/^[-*]\s+(.*)/);

            if (bulletMatch) {
                if (!currentList) {
                    currentList = document.createElement('ul');
                    currentList.className = 'ai-bullet-list ai-response-line';
                    currentList.style.animationDelay = (blockIndex * 0.08) + 's';
                    container.appendChild(currentList);
                    blockIndex++;
                }
                const li = document.createElement('li');
                li.innerHTML = parseInlineMarkdown(bulletMatch[1]);
                currentList.appendChild(li);
                hasContent = true;
                return;
            }

            currentList = null; // a non-bullet line closes the current list

            const p = document.createElement('p');
            if (headingMatch) {
                p.classList.add('ai-heading');
                p.innerHTML = parseInlineMarkdown(headingMatch[1]);
            } else {
                p.innerHTML = parseInlineMarkdown(line);
            }
            p.classList.add('ai-response-line');
            p.style.animationDelay = (blockIndex * 0.08) + 's';
            container.appendChild(p);
            blockIndex++;
            hasContent = true;
        });
    }

    function appendCodeSegment(lang, code) {
        // Paid-only diagram blocks render as sanitized inline SVG instead
        // of a code box. Free plans never get this — the free brain never
        // outputs a 'diagram' block, but this check is a safety net too.
        if (isPaidPlan() && lang && lang.trim().toLowerCase() === 'diagram') {
            const dwrap = document.createElement('div');
            dwrap.className = 'ai-diagram-block ai-response-line';
            dwrap.style.animationDelay = (blockIndex * 0.08) + 's';
            dwrap.innerHTML = sanitizeSvgForDisplay(code.trim());
            container.appendChild(dwrap);
            blockIndex++;
            hasContent = true;
            return;
        }

        const wrap = document.createElement('div');
        wrap.className = 'ai-code-block ai-response-line';
        wrap.style.animationDelay = (blockIndex * 0.08) + 's';

        const header = document.createElement('div');
        header.className = 'ai-code-header';

        const langLabel = document.createElement('span');
        langLabel.className = 'ai-code-lang';
        langLabel.textContent = lang ? lang : 'text';
        header.appendChild(langLabel);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'ai-code-copy-btn';
        copyBtn.innerHTML = ICONS.copy;
        copyBtn.addEventListener('click', () => copyToClipboard(code.trim(), copyBtn));
        header.appendChild(copyBtn);

        wrap.appendChild(header);

        const pre = document.createElement('pre');
        pre.className = 'ai-code-content';
        const codeEl = document.createElement('code');
        codeEl.innerHTML = isPaidPlan() ? highlightCode(code.trim()) : escapeHtmlForCode(code.trim());
        pre.appendChild(codeEl);
        wrap.appendChild(pre);

        container.appendChild(wrap);
        blockIndex++;
        hasContent = true;
    }

    while ((match = codeBlockRegex.exec(text)) !== null) {
        const before = text.slice(lastIndex, match.index);
        if (before.trim()) appendTextSegment(before);
        appendCodeSegment(match[1], match[2]);
        lastIndex = codeBlockRegex.lastIndex;
    }

    const remaining = text.slice(lastIndex);
    if (remaining.trim()) appendTextSegment(remaining);

    if (!hasContent) appendTextSegment(text);
}

// Copies plain text to the clipboard, then briefly swaps the button's
// icon to a checkmark ("Copied") before reverting back to the copy icon
function copyToClipboard(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
        if (!btn) return;
        btn.innerHTML = ICONS.check;
        btn.classList.add('copied');
        clearTimeout(btn._copyRevertTimer);
        btn._copyRevertTimer = setTimeout(() => {
            btn.innerHTML = ICONS.copy;
            btn.classList.remove('copied');
        }, 1500);
    }).catch(() => {});
}

// Builds a single icon button — passes itself into onClick so callers
// (like copyToClipboard) can update their own icon/state
function makeIconBtn(iconKey, onClick) {
    const btn = document.createElement('button');
    btn.className = 'msg-icon-btn';
    btn.innerHTML = ICONS[iconKey];
    btn.addEventListener('click', () => onClick(btn));
    return btn;
}

// Builds the row of attached files/images shown above a sent message —
// images get a real thumbnail, everything else gets a small extension badge
function buildMessageAttachments(files) {
    const row = document.createElement('div');
    row.className = 'msg-attachments';

    files.forEach(file => {
        const item = document.createElement('div');
        item.className = 'msg-attachment';
        item.addEventListener('click', () => {
            const url = URL.createObjectURL(file);
            window.open(url, '_blank');
            setTimeout(() => URL.revokeObjectURL(url), 30000);
        });

        if (file.type && file.type.startsWith('image/')) {
            const img = document.createElement('img');
            img.className = 'msg-attachment-img';
            img.src = URL.createObjectURL(file);
            item.appendChild(img);
        } else {
            const badge = document.createElement('div');
            badge.className = 'msg-attachment-file';

            const ext = document.createElement('span');
            ext.className = 'msg-attachment-ext';
            const parts = file.name.split('.');
            ext.textContent = parts.length > 1 ? parts.pop().toUpperCase() : 'FILE';

            const name = document.createElement('span');
            name.className = 'msg-attachment-name';
            name.textContent = file.name;
            name.title = file.name;

            badge.appendChild(ext);
            badge.appendChild(name);
            item.appendChild(badge);
        }

        row.appendChild(item);
    });

    return row;
}



// Appends a user message bubble to the chat area, and smoothly scrolls
// so this new message lands consistently just below the blur banner.
// `files` is an optional array of File objects attached via the paperclip menu.
function appendUserMessage(text, files) {
    const area = document.getElementById('chatMessagesArea');
    const spacer = document.getElementById('chatSpacer');
    if (!area || !spacer) return;
    files = files || [];

    const div = document.createElement('div');
    div.className = 'msg-user';

    // Column wrapper: attachments (if any) + bubble on top, hover-only copy icon below it
    const col = document.createElement('div');
    col.className = 'msg-user-col';

    if (files.length > 0) {
        col.appendChild(buildMessageAttachments(files));
    }

    const bubble = document.createElement('span');
    bubble.className = 'msg-user-bubble';
    bubble.textContent = text;
    applyBubbleColor(bubble);

    const actions = document.createElement('div');
    actions.className = 'msg-user-actions';
    actions.appendChild(makeIconBtn('copy', (btn) => copyToClipboard(text, btn)));

    // Show the copy icon only when the cursor is over the bubble itself
    // (or the icon while moving toward it), not the full-width row
    const showActions = () => { actions.style.opacity = '1'; };
    const hideActions = () => { actions.style.opacity = '0'; };
    bubble.addEventListener('mouseenter', showActions);
    bubble.addEventListener('mouseleave', hideActions);
    actions.addEventListener('mouseenter', showActions);
    actions.addEventListener('mouseleave', hideActions);

    col.appendChild(bubble);
    col.appendChild(actions);
    div.appendChild(col);

    // Insert the new message BEFORE the spacer, so spacer always stays last
    area.insertBefore(div, spacer);

    // Resize spacer so there's always enough scroll room to push
    // this new message all the way to the top, even in short chats
    spacer.style.height = area.clientHeight + 'px';

    // Wait for the DOM to paint, then smoothly scroll this message into view.
    // scroll-margin-top (set in CSS) ensures it stops right below the blur band,
    // never underneath it and never overshooting.
    requestAnimationFrame(() => {
        div.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
}

// Builds the copy/like/dislike icon row for a completed AI response
function buildAIActions(text) {
    const actions = document.createElement('div');
    actions.className = 'msg-ai-actions';

    actions.appendChild(makeIconBtn('copy', (btn) => copyToClipboard(text, btn)));

    let liked = false;
    let disliked = false;

    function updateFeedbackColors() {
        likeBtn.style.color = liked ? '#4ade80' : '';
        dislikeBtn.style.color = disliked ? '#f87171' : '';
    }

    const likeBtn = makeIconBtn('thumbsUp', () => {
        liked = !liked;
        if (liked) disliked = false;
        updateFeedbackColors();
    });
    const dislikeBtn = makeIconBtn('thumbsDown', () => {
        disliked = !disliked;
        if (disliked) liked = false;
        updateFeedbackColors();
    });

    actions.appendChild(likeBtn);
    actions.appendChild(dislikeBtn);

    return actions;
}

// showActions = false while it's just the "Thinking..." placeholder
// isThinking = true applies the shimmer effect to the text
function appendAIMessage(text, showActions = true, isThinking = false) {
    const area = document.getElementById('chatMessagesArea');
    const spacer = document.getElementById('chatSpacer');
    if (!area || !spacer) return;

    const div = document.createElement('div');
    div.className = 'msg-ai' + (isPaidPlan() ? ' msg-ai-paid' : '');

    if (isThinking) {
        const p = document.createElement('p');
        p.textContent = text;
        p.classList.add('thinking-shimmer');
        div.appendChild(p);
    } else {
        renderAIContent(div, text);
    }

    if (showActions) {
        div.appendChild(buildAIActions(text));
    }

    area.insertBefore(div, spacer);
}

// Renders a completed AI image message — used both right after generation
// and when reloading a saved conversation that contains an image
function appendAIImageMessage(imageSrc) {
    const area = document.getElementById('chatMessagesArea');
    const spacer = document.getElementById('chatSpacer');
    if (!area || !spacer) return;

    const div = document.createElement('div');
    div.className = 'msg-ai';

    const img = document.createElement('img');
    img.src = imageSrc;
    img.style.maxWidth = '320px';
    img.style.borderRadius = '14px';
    img.style.display = 'block';
    div.appendChild(img);

    area.insertBefore(div, spacer);
}

// Replaces the placeholder text with the real response, removes the
// shimmer, and adds the copy/like/dislike row now that there's a real answer
function updateAIMessage(msgEl, newText) {
    if (!msgEl) return;

    msgEl.classList.toggle('msg-ai-paid', isPaidPlan());
    msgEl.querySelectorAll('p, .ai-code-block, .ai-diagram-block').forEach(el => el.remove());
    const oldActions = msgEl.querySelector('.msg-ai-actions');
    if (oldActions) oldActions.remove();

    renderAIContent(msgEl, newText);

    msgEl.appendChild(buildAIActions(newText));
}
