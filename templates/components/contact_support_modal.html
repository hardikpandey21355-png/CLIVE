<style>

/* Modal Container */

  position: fixed;
  top: 50%;

  z-index: 9999;
  width: 90%;
  max-width: 440px;
  background: #ffffff;
  border-radius: 20px;

    0 8px 24px rgba(0, 0, 0, 0.08),

  overflow: hidden;
  opacity: 0;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
}
.cs-modal.cs-show {

  transform: translate(-50%, -50%) scale(1);

  color: #57534e;
  display: flex; 
  align-items: center; 
  justify-content: center;
  flex-shrink: 0;
}

.cs-title {

  font-size: 1.125rem; 
  font-weight: 600; 
  color: #1c1917; 
  margin: 0 0 0.125rem; 
  letter-spacing: -0.01em;
}

.cs-subtitle {

<!-- ═══ SCRIPT ═══ -->
<script>
function openContactSupport() {
  document.getElementById('cs-modal').classList.add('cs-show');
  document.getElementById('cs-overlay').classList.add('cs-show');
  document.body.style.overflow = 'hidden';
}

function closeContactSupport() {
  document.getElementById('cs-modal').classList.remove('cs-show');
  document.getElementById('cs-overlay').classList.remove('cs-show');
  document.body.style.overflow = '';
}

// Close on Escape key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeContactSupport();
});

// ADD THIS — closes modal when user returns to the tab
window.addEventListener('focus', function() {
  closeContactSupport();
});

// Upgrade prompt
function openUpgradePrompt() {
  alert('Upgrade to Premium to unlock phone support!');
}
</script>



<script type="module">
import { auth, onAuthStateChanged, db, doc, getDoc } from "{{ url_for('static', filename='js/firebase-init.js') }}";

function unlockPhoneRow(rowId, badgeId, valueId, hintId, lockId) {
    const row = document.getElementById(rowId);
    if (!row) return;
    row.classList.remove('cs-row-locked');
    row.removeAttribute('onclick');
    row.style.cursor = 'default';

    const badge = document.getElementById(badgeId);
    if (badge) {
        badge.textContent = 'UNLOCKED';
        badge.classList.remove('cs-badge-paid');
        badge.classList.add('cs-badge-free');
    }
    const value = document.getElementById(valueId);
    if (value) value.classList.remove('cs-blurred');

    const hint = document.getElementById(hintId);
    if (hint) hint.style.display = 'none';

    const lock = document.getElementById(lockId);
    if (lock) lock.style.display = 'none';
}

function unlockContactSupportPhones() {
    unlockPhoneRow('csPhoneRow1', 'csPhoneBadge1', 'csPhoneValue1', 'csPhoneHint1', 'csPhoneLock1');
    unlockPhoneRow('csPhoneRow2', 'csPhoneBadge2', 'csPhoneValue2', 'csPhoneHint2', 'csPhoneLock2');
}

onAuthStateChanged(auth, async (user) => {
    if (!user) return; // free/logged-out behavior stays exactly as-is
    try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        const plan = snap.exists() ? (snap.data().selectedPlan || 'free') : 'free';
        if (plan !== 'free') {
            unlockContactSupportPhones();
        }
        // plan === 'free' → do nothing, rows stay locked exactly as before
    } catch (err) {
        console.error('Failed to load plan for Contact Support:', err);
        // on any error, rows stay locked — fails safe toward free behavior
    }
});
</script>
