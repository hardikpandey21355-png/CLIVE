    const files = window.getAttachedFiles ? window.getAttachedFiles() : [];
    appendUserMessage(message, files);

    // TODO: replace this with a real API call later
    setTimeout(() => appendAIMessage("This is a placeholder response."), 400);

    messageInput.value = '';
    messageInput.style.height = 'auto';

    if (window.clearAttachedFiles) window.clearAttachedFiles();
}
// Click on Send button
sendButton.addEventListener('click', sendMessage);
// Press Enter to send (Shift + Enter for new line)
messageInput.addEventListener('keydown', function(e) {

<script>
/* --- Active input feature (e.g. Imagine's "Create image" badge) --- */
let activeInputFeature = null;

const DEFAULT_PLACEHOLDER = 'What do you want to know?';
const FEATURE_PLACEHOLDERS = {
    deepResearch:  'What would you like me to research?',
    webSearch:     'What should I search the web for?',
    coder:         'Describe the code you need…',
    shortResponse: 'Ask a quick question…'
};

function activateInputFeature(key, label, iconSVG) {
    activeInputFeature = key;
    const badge = document.getElementById('inputFeatureBadge');
    document.getElementById('inputFeatureBadgeIcon').innerHTML = iconSVG;
    document.getElementById('inputFeatureBadgeText').textContent = label;
    badge.classList.add('active');
    if (FEATURE_PLACEHOLDERS[key]) messageInput.placeholder = FEATURE_PLACEHOLDERS[key];
    messageInput.focus();
}

function clearInputFeature() {
    const previous = activeInputFeature;
    activeInputFeature = null;
    document.getElementById('inputFeatureBadge').classList.remove('active');
    if (FEATURE_PLACEHOLDERS[previous]) messageInput.placeholder = DEFAULT_PLACEHOLDER;
    return previous;
}

window.activateInputFeature = activateInputFeature;
window.clearInputFeature = clearInputFeature;

/* Auto-grow the textarea height as the user types multi-line text */
const messageInput = document.getElementById('messageInput');
const inputWrapper  = document.getElementById('inputWrapper');
let hasMovedToBottom = false;

messageInput.addEventListener('focus', function() {
    if (window.fadeOutBackgroundVideo) window.fadeOutBackgroundVideo();
});

messageInput.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace' && messageInput.value === '' && activeInputFeature) {
        const feature = clearInputFeature();
        if (feature === 'imagine' && window.closeImagineMode) window.closeImagineMode();
    }
});

messageInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = this.scrollHeight + 'px';

    if (!hasMovedToBottom && this.value.length > 0) {
        inputWrapper.classList.add('moved-to-bottom');
        hasMovedToBottom = true;
        enterChatMode();
    }
});

// Hides the landing-state elements and reveals the chat actions bar
function enterChatMode() {
    if (window.closeImagineMode) window.closeImagineMode();

    const chatTopBlur     = document.querySelector('.chat-top-blur');
    const chatMessagesArea = document.getElementById('chatMessagesArea');
    if (chatTopBlur)      chatTopBlur.classList.add('chat-active');
    if (chatMessagesArea) chatMessagesArea.classList.add('chat-active');

    const cliveTitle    = document.getElementById('cliveTitle');
    const quickActions  = document.getElementById('quickActions');
    const offersSection = document.getElementById('offersSection');
    const privacyBtn    = document.querySelector('.privacy-btn');
    const aboutBtn      = document.querySelector('.about-btn');
    const voiceBtn      = document.querySelector('.voice-btn');
    const featuresBtn   = document.querySelector('.features-btn');
    const helpBtn       = document.querySelector('.help-btn');
    const upgradeBtn    = document.querySelector('.upgrade-plan-btn');

    if (cliveTitle)    cliveTitle.style.display = 'none';
    if (quickActions)  quickActions.style.display = 'none';
    if (offersSection) offersSection.style.display = 'none';
    if (privacyBtn)    privacyBtn.style.display = 'none';
    if (aboutBtn)      aboutBtn.style.display = 'none';
    if (voiceBtn)      voiceBtn.style.display = 'none';
    if (featuresBtn)   featuresBtn.style.display = 'none';
    if (helpBtn)       helpBtn.style.display = 'none';
    if (upgradeBtn)    upgradeBtn.style.display = 'none';

    // NEW: auto-collapse the sidebar if it was left expanded
    const sidebar = document.getElementById('sidebar');
    if (sidebar && sidebar.classList.contains('expanded')) {
        sidebar.classList.remove('expanded');
        if (cliveTitle)   cliveTitle.classList.remove('sidebar-shifted');
        if (inputWrapper) inputWrapper.classList.remove('sidebar-shifted');
        if (quickActions) quickActions.classList.remove('sidebar-shifted');
    }

    // Lock the sidebar toggle so it can't be reopened mid-chat
    isChatModeActive = true;
    const sidebarToggle = document.querySelector('.sidebar-toggle');
    if (sidebarToggle) sidebarToggle.classList.add('toggle-disabled');

    const chatActionsBar = document.getElementById('chatActionsBar');
    if (chatActionsBar) chatActionsBar.classList.add('fade-in');
}
</script>

<script>
/* Open/close behavior for the paperclip popup (click icon, click outside, click overlay) */
const paperclipButton  = document.getElementById('paperclipButton');
const paperclipPopup   = document.getElementById('paperclip-popup');
const paperclipOverlay = document.getElementById('paperclip-overlay');
function closepaperclipPopup() {
    paperclipPopup.classList.remove('show');
    paperclipOverlay.classList.remove('show');
}
paperclipButton.addEventListener('click', function(e) {
    e.stopPropagation();
    const willShow = !paperclipPopup.classList.contains('show');
    if (willShow) positionPaperclipPopup();
    paperclipPopup.classList.toggle('show');
    paperclipOverlay.classList.toggle('show');
});

// Anchors the popup directly above the paperclip button, wherever the
// input bar currently sits (centered on homepage, or docked at bottom in chat)
function positionPaperclipPopup() {
    const btnRect = paperclipButton.getBoundingClientRect();
    const gap = 14;
    const rightShift = 70; // shifts the popup toward the right of the button
    paperclipPopup.style.left = (btnRect.left + btnRect.width / 2 + rightShift) + 'px';

    if (hasMovedToBottom) {
        // Input bar docked at the bottom — popup floats above it
        paperclipPopup.style.bottom = (window.innerHeight - btnRect.top + gap) + 'px';
        paperclipPopup.style.top = 'auto';
    } else {
        // Input bar still centered on the homepage — popup drops below it
        paperclipPopup.style.top = (btnRect.bottom + gap) + 'px';
        paperclipPopup.style.bottom = 'auto';
    }
}
paperclipOverlay.addEventListener('click', closepaperclipPopup);
document.addEventListener('click', function(e) {
    if (!paperclipPopup.contains(e.target) && !paperclipButton.contains(e.target)) {
        closepaperclipPopup();
    }
});
</script>

<script>
/* --- File / photo attachments --- */
let attachedFiles = [];

function triggerAddFiles() {
    closepaperclipPopup();
    document.getElementById('attachFileInput').click();
}
window.triggerAddFiles = triggerAddFiles;

function getFileExt(name) {
    const parts = name.split('.');
    return parts.length > 1 ? parts.pop().toUpperCase() : 'FILE';
}

function renderAttachments() {
    const wrap = document.getElementById('inputAttachments');
    wrap.innerHTML = '';
    wrap.classList.toggle('has-files', attachedFiles.length > 0);

    attachedFiles.forEach((file, index) => {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.addEventListener('click', () => openAttachedFile(file));

        if (file.type && file.type.startsWith('image/')) {
            const img = document.createElement('img');
            img.className = 'file-chip-thumb';
            img.src = URL.createObjectURL(file);
            chip.appendChild(img);
        } else {
            const badge = document.createElement('span');
            badge.className = 'file-chip-badge';
            badge.textContent = getFileExt(file.name);
            chip.appendChild(badge);
        }

        const name = document.createElement('span');
        name.className = 'file-chip-name';
        name.textContent = file.name;
        name.title = file.name;
        chip.appendChild(name);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'file-chip-remove';
        removeBtn.setAttribute('aria-label', 'Remove file');
        removeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        removeBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            attachedFiles.splice(index, 1);
            renderAttachments();
        });
        chip.appendChild(removeBtn);

        wrap.appendChild(chip);
    });
}

const MAX_ATTACHED_FILES = 5;

document.getElementById('attachFileInput').addEventListener('change', function(e) {
    const incoming = Array.from(e.target.files);
    const remaining = MAX_ATTACHED_FILES - attachedFiles.length;

    if (remaining <= 0) {
        showAttachmentLimitNotice();
        this.value = '';
        return;
    }

    attachedFiles = attachedFiles.concat(incoming.slice(0, remaining));
    if (incoming.length > remaining) showAttachmentLimitNotice();

    renderAttachments();
    this.value = ''; // allows picking the same file again later

    // Attaching a file counts as starting to chat, same as typing —
    // dock the input bar to the bottom just like messageInput's input event does.
    if (!hasMovedToBottom) {
        inputWrapper.classList.add('moved-to-bottom');
        hasMovedToBottom = true;
        enterChatMode();
    }
});

function showAttachmentLimitNotice() {
    const wrap = document.getElementById('inputAttachments');
    let notice = document.getElementById('attachmentLimitNotice');
    if (!notice) {
        notice = document.createElement('div');
        notice.id = 'attachmentLimitNotice';
        notice.className = 'attachment-limit-notice';
        notice.textContent = 'You can attach up to ' + MAX_ATTACHED_FILES + ' files at a time.';
        wrap.parentElement.insertBefore(notice, wrap.nextSibling);
    }
    notice.classList.add('show');
    clearTimeout(showAttachmentLimitNotice._timer);
    showAttachmentLimitNotice._timer = setTimeout(() => notice.classList.remove('show'), 2500);
}

function openAttachedFile(file) {
    const url = URL.createObjectURL(file);
    window.open(url, '_blank');
    // Revoke a little later so the new tab has time to load it
    setTimeout(() => URL.revokeObjectURL(url), 30000);
}

window.getAttachedFiles   = () => attachedFiles;
window.clearAttachedFiles = () => { attachedFiles = []; renderAttachments(); };
window.showAttachmentLimitNotice = showAttachmentLimitNotice;
</script>

function toggleFeatureOption(key, label) {
    if (activeInputFeature === key) {
        clearInputFeature();
    } else {
        activateInputFeature(key, label, FEATURE_ICONS[key]);
    }
    closepaperclipPopup();
}

function selectDeepResearch()  { toggleFeatureOption('deepResearch', 'Deep Research'); }
function selectWebSearch()     { toggleFeatureOption('webSearch', 'Web Search'); }
function selectCoder()         { toggleFeatureOption('coder', 'Coder'); }
function selectShortResponse() { toggleFeatureOption('shortResponse', 'Short response'); }

window.selectDeepResearch  = selectDeepResearch;
window.selectWebSearch     = selectWebSearch;
window.selectCoder         = selectCoder;
window.selectShortResponse = selectShortResponse;

/* --- Take a screenshot: captures the screen and attaches it like a file --- */
async function triggerScreenshot() {
    closepaperclipPopup();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        console.error('Screenshot not supported in this browser.');
        return;
    }

    let stream;
    try {
        stream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: 'never' } });
        const track = stream.getVideoTracks()[0];

        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        await new Promise(resolve => setTimeout(resolve, 200)); // let a real frame render

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        track.stop();

        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (!blob) return;

        if (attachedFiles.length >= MAX_ATTACHED_FILES) {
            if (window.showAttachmentLimitNotice) window.showAttachmentLimitNotice();
            return;
        }

        const file = new File([blob], 'screenshot-' + Date.now() + '.png', { type: 'image/png' });
        attachedFiles.push(file);
        renderAttachments();

        if (!hasMovedToBottom) {
            inputWrapper.classList.add('moved-to-bottom');
            hasMovedToBottom = true;
            enterChatMode();
        }
    } catch (err) {
        // User cancelled the screen-share prompt, or permission was denied
        console.error('Screenshot failed or was cancelled:', err);
        if (stream) stream.getTracks().forEach(t => t.stop());
    }
}
window.triggerScreenshot = triggerScreenshot;
</script>
