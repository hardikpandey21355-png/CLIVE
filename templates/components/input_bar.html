<script>
// ===================== SEND FUNCTIONALITY =====================
const sendButton = document.getElementById('sendButton');
function sendMessage() {
    const message = messageInput.value.trim();
    if (message === '') return;

    appendUserMessage(message);

    // TODO: replace this with a real API call later
    setTimeout(() => appendAIMessage("This is a placeholder response."), 400);

    messageInput.value = '';
    messageInput.style.height = 'auto';
}
// Click on Send button
sendButton.addEventListener('click', sendMessage);
// Press Enter to send (Shift + Enter for new line)
messageInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
</script>

<!-- ============================== CSS STYLES FOR INPUT BAR ============================== -->
<style>
/* Wrapper that centers the input bar on the page */
.center-wrapper {
    position: absolute;
    top: 46%;
    left: 53%;
    transform: translate(-50%, -50%);
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 2;
    /* transition: all 0.4s ease; */
}
/* Shift input bar right when sidebar expands (same offset as clive-title) */
.center-wrapper.sidebar-shifted {
    left: calc(53% + 5.5%);
}
/* Main input bar container (dark rounded box) */
.input-bar {
    background: #1a1a1a;
    border-radius: 28px;
    border: 1px solid #88888875;
    display: flex;
    flex-direction: column;
    padding: 18px 22px;
    width: 75%;
    max-width: 750px;
    line-height: 1;
}
.input-bottom-row {
    display: flex;
    align-items: flex-end;
    width: 100%;
}

/* Icon button wrapper (paperclip / mic / send) */
.icon-button {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    align-self: flex-end;
    padding-bottom: 1px;
}
.icon-button:hover { opacity: 0.8; }
.icon-button:active { opacity: 0.6; }
.icon {
    width: 20px;
    height: 20px;
    min-width: 20px;
    min-height: 20px;
    color: #fff;
    display: block;
    flex-shrink: 0;
    overflow: visible;
    stroke-width: 1.8;
    -webkit-font-smoothing: antialiased;
}

/* Textarea field - grows automatically as user types multiple lines */
.input-field {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    resize: none;
    color: #ccc;
    font-size: 16px;
    font-family: Arial, sans-serif;
    line-height: 1.4;
    padding: 0 10px;
    max-height: 200px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #444 transparent;
}
.input-field::-webkit-scrollbar { width: 6px; }
.input-field::-webkit-scrollbar-track { background: transparent; }
.input-field::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
.input-field::-webkit-scrollbar-thumb:hover { background: #555; }
.input-field::placeholder { color: #888; }

/* Right side group (mic + send) */
.right-icons {
    display: flex;
    align-items: center;
    gap: 15px;
    flex-shrink: 0;
    margin-left: auto;
}

/* ── PAPERCLIP POPUP ── */
/* Transparent fullscreen overlay used to detect outside clicks */
.paperclip-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: transparent;
    z-index: 9998;
    display: none;
}
.paperclip-overlay.show { display: block; }

/* Popup box itself - appears above paperclip icon */
.paperclip-popup {
    position: fixed;
    bottom: 125px;
    left: 35%;
    transform: translateX(-50%);
    width: 210px;
    background: #2d2d2d;
    border-radius: 16px;
    padding: 8px;
    z-index: 9999;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    display: none;
    animation: popupSlideUp 0.2s ease-out;
}
@keyframes popupSlideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.paperclip-popup.show { display: block; }

/* Each row inside the popup */
.popup-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s ease;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 15px;
}
.popup-option:hover { background: rgba(255, 255, 255, 0.08); }
.popup-option svg { width: 20px; height: 20px; flex-shrink: 0; stroke: white; }
.popup-option span { flex: 1; color: white; }

/* Trailing icons used in some rows */
.arrow-right { width: 16px !important; height: 16px !important; opacity: 0.5; margin-left: auto; }
.checkmark { width: 18px !important; height: 18px !important; stroke: #4a9eff; margin-left: auto; }
.web-search-text { color: #4a9eff; }

/* ===== NEW: Bottom position after first input ===== */
.center-wrapper.moved-to-bottom {
    top: auto;
    bottom: 30px;
    left: 53%;
    transform: translateX(-50%);
}
.center-wrapper.moved-to-bottom.sidebar-shifted {
    left: calc(53% + 5.5%);
    transform: translateX(-50%);
}
</style>

<script>
/* Auto-grow the textarea height as the user types multi-line text */
const messageInput = document.getElementById('messageInput');
const inputWrapper  = document.getElementById('inputWrapper');
let hasMovedToBottom = false;

messageInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = this.scrollHeight + 'px';

    if (!hasMovedToBottom && this.value.length > 0) {
        inputWrapper.classList.add('moved-to-bottom');
        hasMovedToBottom = true;
        enterChatMode();
    }
});

// Hides the landing-state elements and reveals the chat actions bar
function enterChatMode() {
    const cliveTitle    = document.getElementById('cliveTitle');
    const quickActions  = document.getElementById('quickActions');
    const offersSection = document.getElementById('offersSection');
    const privacyBtn    = document.querySelector('.privacy-btn');
    const aboutBtn      = document.querySelector('.about-btn');
    const voiceBtn      = document.querySelector('.voice-btn');
    const featuresBtn   = document.querySelector('.features-btn');
    const helpBtn       = document.querySelector('.help-btn');
    const upgradeBtn    = document.querySelector('.upgrade-plan-btn');

    if (cliveTitle)    cliveTitle.style.display = 'none';
    if (quickActions)  quickActions.style.display = 'none';
    if (offersSection) offersSection.style.display = 'none';
    if (privacyBtn)    privacyBtn.style.display = 'none';
    if (aboutBtn)      aboutBtn.style.display = 'none';
    if (voiceBtn)      voiceBtn.style.display = 'none';
    if (featuresBtn)   featuresBtn.style.display = 'none';
    if (helpBtn)       helpBtn.style.display = 'none';
    if (upgradeBtn)    upgradeBtn.style.display = 'none';

    // NEW: auto-collapse the sidebar if it was left expanded
    const sidebar = document.getElementById('sidebar');
    if (sidebar && sidebar.classList.contains('expanded')) {
        sidebar.classList.remove('expanded');
        if (cliveTitle)   cliveTitle.classList.remove('sidebar-shifted');
        if (inputWrapper) inputWrapper.classList.remove('sidebar-shifted');
        if (quickActions) quickActions.classList.remove('sidebar-shifted');
    }

    // Lock the sidebar toggle so it can't be reopened mid-chat
    isChatModeActive = true;
    const sidebarToggle = document.querySelector('.sidebar-toggle');
    if (sidebarToggle) sidebarToggle.classList.add('toggle-disabled');

    const chatActionsBar = document.getElementById('chatActionsBar');
    if (chatActionsBar) chatActionsBar.classList.add('fade-in');
}
</script>

<script>
/* Open/close behavior for the paperclip popup (click icon, click outside, click overlay) */
const paperclipButton  = document.getElementById('paperclipButton');
const paperclipPopup   = document.getElementById('paperclip-popup');
const paperclipOverlay = document.getElementById('paperclip-overlay');
function closepaperclipPopup() {
    paperclipPopup.classList.remove('show');
    paperclipOverlay.classList.remove('show');
}
paperclipButton.addEventListener('click', function(e) {
    e.stopPropagation();
    paperclipPopup.classList.toggle('show');
    paperclipOverlay.classList.toggle('show');
});
paperclipOverlay.addEventListener('click', closepaperclipPopup);
document.addEventListener('click', function(e) {
    if (!paperclipPopup.contains(e.target) && !paperclipButton.contains(e.target)) {
        closepaperclipPopup();
    }
});
</script>
