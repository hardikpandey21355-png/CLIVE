<script>
// ===================== SEND FUNCTIONALITY =====================
const sendButton = document.getElementById('sendButton');

async function sendMessage() {
    const message = messageInput.value.trim();
    const attachedNow = window.getAttachedFiles ? window.getAttachedFiles() : [];
    if (message === '' && attachedNow.length === 0) return;

    const isImagineMode = activeInputFeature === 'imagine';

    if (!isImagineMode && window.checkAiResponseAllowed) {
        const check = await window.checkAiResponseAllowed();
        if (!check.allowed) {
            if (window.showAiLimitBlockedToast) window.showAiLimitBlockedToast(check.limit);
            return;
        }
    }

    const isPrivate = window.getPrivacyMode ? window.getPrivacyMode() : false;

    const files = attachedNow;
    appendUserMessage(message, files);

    messageInput.value = '';
    messageInput.style.height = 'auto';
    if (window.clearAttachedFiles) window.clearAttachedFiles();

    if (isImagineMode) {
        if (window.closeImagineMode) window.closeImagineMode();
        await sendImagePrompt(message, isPrivate);
        return;
    }

    const LIVE_INFO_REGEX = /\b(latest|breaking|current(ly)?|today'?s?|this week'?s?|right now|live|recent(ly)?|update on|happening now|news|headlines?|score|results?|who won|stock price|share price|exchange rate|weather (today|now|tomorrow)|election results?|current price|trending)\b/i;
    const DEEP_HINT_REGEX = /\b(compare|comparison|pros and cons|in[- ]depth|detailed analysis|research|report on|deep dive|explain in detail|everything about)\b/i;

    let effectiveFeature = activeInputFeature;
    if (!effectiveFeature && LIVE_INFO_REGEX.test(message)) {
        effectiveFeature = DEEP_HINT_REGEX.test(message) ? 'deepResearch' : 'webSearch';
    }

    const thinkingLabel = effectiveFeature === 'deepResearch' ? "Researching..."
        : effectiveFeature === 'webSearch' ? "Searching the web..."
        : "Thinking...";
    appendAIMessage(thinkingLabel, false, true);
    const aiMessages = document.querySelectorAll('.msg-ai');
    const thinkingEl = aiMessages[aiMessages.length - 1];

    try {
        const formData = new FormData();
        formData.append('message', message);
        formData.append('privacy', isPrivate ? 'true' : 'false');
        formData.append('feature', activeInputFeature || 'none');
        formData.append('mood', localStorage.getItem('clive_agent_mood') || 'default');
        formData.append('plan', window.currentUserPlan || 'free');
        formData.append('project_name', (typeof activeProject !== 'undefined' && activeProject) ? activeProject.name : '');
        formData.append('project_description', (typeof activeProject !== 'undefined' && activeProject) ? (activeProject.description || '') : '');
        formData.append('project_resources', (typeof activeProject !== 'undefined' && activeProject) ? JSON.stringify(activeProject.resources || []) : '[]');
        files.forEach(f => formData.append('files', f));

        const res = await fetch('/api/chat', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();

       if (data.reply) {
    updateAIMessage(thinkingEl, data.reply);
    if (window.saveMessagePairToFirestore && !isPrivate) {
        window.saveMessagePairToFirestore(message, data.reply);
    }
    if (window.recordAiResponse) window.recordAiResponse();
} else {
    updateAIMessage(thinkingEl, "Sorry, something went wrong.");
}
    } catch (err) {
        console.error(err);
        updateAIMessage(thinkingEl, "Sorry, I couldn't reach the server.");
    }
}

async function sendImagePrompt(prompt, isPrivate) {
    if (window.checkImageGenerationAllowed) {
        const check = await window.checkImageGenerationAllowed();
        if (!check.allowed) {
            if (window.showImageLimitToast) window.showImageLimitToast(check.limit);
            return;
        }
    }

    const area = document.getElementById('chatMessagesArea');
    const spacer = document.getElementById('chatSpacer');
    if (!area || !spacer) return;

    // Build the AI message container ourselves (instead of using
    // appendAIMessage's "Thinking..." text) so we can drop in a
    // properly-sized animated placeholder box instead.
    const thinkingEl = document.createElement('div');
    thinkingEl.className = 'msg-ai';
    thinkingEl.innerHTML = '<div class="image-gen-placeholder"></div>';
    area.insertBefore(thinkingEl, spacer);

    requestAnimationFrame(() => {
        thinkingEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    try {
        const res = await fetch('/api/generate-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
        });
        const data = await res.json();

        thinkingEl.innerHTML = '';

        if (data.image) {
            const img = document.createElement('img');
            img.src = data.image;
            img.style.maxWidth = '320px';
            img.style.borderRadius = '14px';
            img.style.display = 'block';
            thinkingEl.appendChild(img);

            if (window.saveMessagePairToFirestore && !isPrivate) {
                window.saveMessagePairToFirestore(prompt, data.image, 'image');
            }
            if (window.recordImageGeneration) window.recordImageGeneration();
        } else {
            const p = document.createElement('p');
            p.textContent = data.error || "Sorry, image generation failed.";
            thinkingEl.appendChild(p);
        }
    } catch (err) {
        console.error(err);
        thinkingEl.innerHTML = '';
        const p = document.createElement('p');
        p.textContent = "Sorry, I couldn't reach the server.";
        thinkingEl.appendChild(p);
    }
}

sendButton.addEventListener('click', sendMessage);
messageInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
</script>

    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: transparent;
    z-index: 9998;
    display: none;
}
.paperclip-overlay.show { display: block; }

/* Popup box itself - appears above paperclip icon.
   top/left are set dynamically in JS right before it's shown (positionPaperclipPopup);
   these are just a fallback in case JS hasn't positioned it yet. */
.paperclip-popup {
    position: fixed;
    bottom: 125px;
    left: 35%;
    transform: translateX(-50%);
    width: 210px;
    background: #2d2d2d;
    border-radius: 16px;
    padding: 8px;

    animation: popupSlideUp 0.2s ease-out;
}
@keyframes popupSlideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Animated placeholder shown while an image is generating —
   several color blobs drifting independently in different
   directions, layered together with a slow hue-rotate on top */
.image-gen-placeholder {
    position: relative;
    width: 320px;
    height: 320px;
    max-width: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: #15151a;
    animation: imageGenHueRotate 8s linear infinite;
}

.image-gen-placeholder::before,
.image-gen-placeholder::after {
    content: '';
    position: absolute;
    inset: -40%;
    background:
        radial-gradient(circle at 20% 30%, #ff5f6d 0%, transparent 45%),
        radial-gradient(circle at 75% 20%, #2575fc 0%, transparent 45%),
        radial-gradient(circle at 30% 80%, #00c9a7 0%, transparent 45%),
        radial-gradient(circle at 80% 75%, #ffd166 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, #6a11cb 0%, transparent 50%);
    filter: blur(18px) saturate(1.4);
}

.image-gen-placeholder::before {
    animation: imageGenDrift1 6.5s ease-in-out infinite;
}

.image-gen-placeholder::after {
    animation: imageGenDrift2 9s ease-in-out infinite;
    mix-blend-mode: screen;
    opacity: 0.85;
}

@keyframes imageGenDrift1 {
    0%   { transform: translate(0%, 0%) rotate(0deg) scale(1); }
    25%  { transform: translate(12%, -8%) rotate(30deg) scale(1.1); }
    50%  { transform: translate(-6%, 10%) rotate(60deg) scale(0.95); }
    75%  { transform: translate(-12%, -6%) rotate(20deg) scale(1.05); }
    100% { transform: translate(0%, 0%) rotate(0deg) scale(1); }
}

@keyframes imageGenDrift2 {
    0%   { transform: translate(0%, 0%) rotate(0deg) scale(1); }
    20%  { transform: translate(-10%, 8%) rotate(-25deg) scale(1.08); }
    45%  { transform: translate(9%, -12%) rotate(-55deg) scale(1); }
    70%  { transform: translate(8%, 9%) rotate(-15deg) scale(1.12); }
    100% { transform: translate(0%, 0%) rotate(0deg) scale(1); }
}

@keyframes imageGenHueRotate {
    0%   { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
}

    const rect = bar.getBoundingClientRect();

    const gap = 12;        // space between the pill and the input bar

<script>
/* Open/close behavior for the paperclip popup (click icon, click outside, click overlay) */
const paperclipButton  = document.getElementById('paperclipButton');
const paperclipPopup   = document.getElementById('paperclip-popup');
const paperclipOverlay = document.getElementById('paperclip-overlay');
function closepaperclipPopup() {
    paperclipPopup.classList.remove('show');
    paperclipOverlay.classList.remove('show');
}
paperclipButton.addEventListener('click', function(e) {
    e.stopPropagation();
    const willShow = !paperclipPopup.classList.contains('show');
    if (willShow) positionPaperclipPopup();
    paperclipPopup.classList.toggle('show');
    paperclipOverlay.classList.toggle('show');
});

// Anchors the popup directly above the paperclip button, wherever the
// input bar currently sits (centered on homepage, or docked at bottom in chat)
function positionPaperclipPopup() {
    const btnRect = paperclipButton.getBoundingClientRect();
    const gap = 14;
    const rightShift = 70; // shifts the popup toward the right of the button
    paperclipPopup.style.left = (btnRect.left + btnRect.width / 2 + rightShift) + 'px';

    if (hasMovedToBottom) {
        // Input bar docked at the bottom — popup floats above it
        paperclipPopup.style.bottom = (window.innerHeight - btnRect.top + gap) + 'px';
        paperclipPopup.style.top = 'auto';
    } else {
        // Input bar still centered on the homepage — popup drops below it
        paperclipPopup.style.top = (btnRect.bottom + gap) + 'px';
        paperclipPopup.style.bottom = 'auto';
    }
}
paperclipOverlay.addEventListener('click', closepaperclipPopup);
document.addEventListener('click', function(e) {
    if (!paperclipPopup.contains(e.target) && !paperclipButton.contains(e.target)) {
        closepaperclipPopup();
    }
});

<script>
/* --- File / photo attachments --- */
let attachedFiles = [];

function triggerAddFiles() {
    closepaperclipPopup();
    document.getElementById('attachFileInput').click();
}
window.triggerAddFiles = triggerAddFiles;

function getFileExt(name) {
    const parts = name.split('.');
    return parts.length > 1 ? parts.pop().toUpperCase() : 'FILE';
}

function renderAttachments() {
    const wrap = document.getElementById('inputAttachments');
    wrap.innerHTML = '';
    wrap.classList.toggle('has-files', attachedFiles.length > 0);

    attachedFiles.forEach((file, index) => {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.addEventListener('click', () => openAttachedFile(file));

        if (file.type && file.type.startsWith('image/')) {
            const img = document.createElement('img');
            img.className = 'file-chip-thumb';
            img.src = URL.createObjectURL(file);
            chip.appendChild(img);
        } else {
            const badge = document.createElement('span');
            badge.className = 'file-chip-badge';
            badge.textContent = getFileExt(file.name);
            chip.appendChild(badge);
        }

        const name = document.createElement('span');
        name.className = 'file-chip-name';
        name.textContent = file.name;
        name.title = file.name;
        chip.appendChild(name);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'file-chip-remove';
        removeBtn.setAttribute('aria-label', 'Remove file');
        removeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        removeBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            attachedFiles.splice(index, 1);
            renderAttachments();
        });
        chip.appendChild(removeBtn);

        wrap.appendChild(chip);
    });
}

const MAX_ATTACHED_FILES = 5;

document.getElementById('attachFileInput').addEventListener('change', function(e) {
    const incoming = Array.from(e.target.files);
    const remaining = MAX_ATTACHED_FILES - attachedFiles.length;

    if (remaining <= 0) {
        showAttachmentLimitNotice();
        this.value = '';
        return;
    }

    attachedFiles = attachedFiles.concat(incoming.slice(0, remaining));
    if (incoming.length > remaining) showAttachmentLimitNotice();

    renderAttachments();
    this.value = ''; // allows picking the same file again later

    // Attaching a file counts as starting to chat, same as typing —
    // dock the input bar to the bottom just like messageInput's input event does.
    if (!hasMovedToBottom) {
        inputWrapper.classList.add('moved-to-bottom');
        hasMovedToBottom = true;
        enterChatMode();
    }
});

function showAttachmentLimitNotice() {
    const wrap = document.getElementById('inputAttachments');
    let notice = document.getElementById('attachmentLimitNotice');
    if (!notice) {
        notice = document.createElement('div');
        notice.id = 'attachmentLimitNotice';
        notice.className = 'attachment-limit-notice';
        notice.textContent = 'You can attach up to ' + MAX_ATTACHED_FILES + ' files at a time.';
        wrap.parentElement.insertBefore(notice, wrap.nextSibling);
    }
    notice.classList.add('show');
    clearTimeout(showAttachmentLimitNotice._timer);
    showAttachmentLimitNotice._timer = setTimeout(() => notice.classList.remove('show'), 2500);
}

function openAttachedFile(file) {
    const url = URL.createObjectURL(file);
    window.open(url, '_blank');
    // Revoke a little later so the new tab has time to load it
    setTimeout(() => URL.revokeObjectURL(url), 30000);
}

window.getAttachedFiles   = () => attachedFiles;
window.clearAttachedFiles = () => { attachedFiles = []; renderAttachments(); };
window.showAttachmentLimitNotice = showAttachmentLimitNotice;
</script>

/* --- Take a screenshot: captures the screen and attaches it like a file --- */
async function triggerScreenshot() {
    closepaperclipPopup();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        console.error('Screenshot not supported in this browser.');
        return;
    }

    let stream;
    try {
        stream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: 'never' } });
        const track = stream.getVideoTracks()[0];

        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        await new Promise(resolve => setTimeout(resolve, 200)); // let a real frame render

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        track.stop();

        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (!blob) return;

        if (attachedFiles.length >= MAX_ATTACHED_FILES) {
            if (window.showAttachmentLimitNotice) window.showAttachmentLimitNotice();
            return;
        }

        const file = new File([blob], 'screenshot-' + Date.now() + '.png', { type: 'image/png' });
        attachedFiles.push(file);
        renderAttachments();

        if (!hasMovedToBottom) {
            inputWrapper.classList.add('moved-to-bottom');
            hasMovedToBottom = true;
            enterChatMode();
        }
    } catch (err) {
        // User cancelled the screen-share prompt, or permission was denied
        console.error('Screenshot failed or was cancelled:', err);
        if (stream) stream.getTracks().forEach(t => t.stop());
    }
}
window.triggerScreenshot = triggerScreenshot;
</script>

<script type="module">
import { auth, onAuthStateChanged, db, doc, getDoc, setDoc, arrayUnion, serverTimestamp, collection, getDocs, deleteDoc } from "{{ url_for('static', filename='js/firebase-init.js') }}?v=2";

let currentUser = null;
let currentConversationId = null;
let messagePairCount = 0;
let firstUserMessageForTitle = null;

onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
        loadConversationFromHistoryIfRequested();
        loadUserPlanAndUsage();
    }
});

/* ---------- IMAGE GENERATION LIMITS ---------- */
const IMAGE_DAILY_LIMITS = { free: 5, go: 15, plus: 15, pro: Infinity };
const AI_DAILY_LIMITS = { free: 20, go: 35, plus: 35, pro: Infinity };
const AI_WARNING_THRESHOLD = 0.9; // 90%

let currentPlan = 'free';
let imageUsageCache = null;   // { date: 'YYYY-MM-DD', count: N }
let messageUsageCache = null; // { date: 'YYYY-MM-DD', count: N }

function todayStr() {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

async function loadUserPlanAndUsage() {
    if (!currentUser) return;
    try {
        const snap = await getDoc(doc(db, 'users', currentUser.uid));
        const data = snap.exists() ? snap.data() : {};
        currentPlan = data.selectedPlan || 'free';
        window.currentUserPlan = currentPlan;

        const usage = data.imageUsage;
        imageUsageCache = (usage && usage.date === todayStr())
            ? { date: usage.date, count: usage.count }
            : { date: todayStr(), count: 0 };

        const msgUsage = data.messageUsage;
        messageUsageCache = (msgUsage && msgUsage.date === todayStr())
            ? { date: msgUsage.date, count: msgUsage.count }
            : { date: todayStr(), count: 0 };
    } catch (err) {
        console.error('Failed to load plan/usage:', err);
        currentPlan = 'free';
        window.currentUserPlan = currentPlan;
        imageUsageCache = { date: todayStr(), count: 0 };
        messageUsageCache = { date: todayStr(), count: 0 };
    }
}

window.recordAiResponse = async function () {
    if (!currentUser) return;
    if (!messageUsageCache || messageUsageCache.date !== todayStr()) {
        messageUsageCache = { date: todayStr(), count: 0 };
    }
    messageUsageCache.count += 1;

    try {
        await setDoc(doc(db, 'users', currentUser.uid), {
            messageUsage: { date: messageUsageCache.date, count: messageUsageCache.count }
        }, { merge: true });
    } catch (err) {
        console.error('Failed to update message usage:', err);
    }

    const limit = AI_DAILY_LIMITS[currentPlan] ?? AI_DAILY_LIMITS.free;
    if (limit !== Infinity && messageUsageCache.count >= Math.floor(limit * AI_WARNING_THRESHOLD)) {
        if (window.showAiLimitBanner) window.showAiLimitBanner(messageUsageCache.count, limit);
    }
};

window.checkAiResponseAllowed = async function () {
    if (!currentUser) return { allowed: true };
    if (!messageUsageCache || messageUsageCache.date !== todayStr()) {
        await loadUserPlanAndUsage();
    }
    const limit = AI_DAILY_LIMITS[currentPlan] ?? AI_DAILY_LIMITS.free;
    if (limit !== Infinity && messageUsageCache.count >= limit) {
        return { allowed: false, limit, used: messageUsageCache.count };
    }
    return { allowed: true, limit, used: messageUsageCache.count };
};

window.checkImageGenerationAllowed = async function () {
    if (!currentUser) return { allowed: true };
    if (!imageUsageCache || imageUsageCache.date !== todayStr()) {
        await loadUserPlanAndUsage();
    }
    const limit = IMAGE_DAILY_LIMITS[currentPlan] ?? IMAGE_DAILY_LIMITS.free;
    if (imageUsageCache.count >= limit) {
        return { allowed: false, limit, used: imageUsageCache.count };
    }
    return { allowed: true, limit, used: imageUsageCache.count };
};

window.recordImageGeneration = async function () {
    if (!currentUser) return;
    if (!imageUsageCache || imageUsageCache.date !== todayStr()) {
        imageUsageCache = { date: todayStr(), count: 0 };
    }
    imageUsageCache.count += 1;
    try {
        await setDoc(doc(db, 'users', currentUser.uid), {
            imageUsage: { date: imageUsageCache.date, count: imageUsageCache.count }
        }, { merge: true });
    } catch (err) {
        console.error('Failed to update image usage:', err);
    }
};

// If the user clicked a chat in History, load its messages into the chat
// area and pick up the same conversation ID so new messages append to it.
async function loadConversationFromHistoryIfRequested() {
    const convoId = localStorage.getItem('clive_open_conversation');
    if (!convoId) return;
    localStorage.removeItem('clive_open_conversation');

    try {
        const convoRef = doc(db, 'users', currentUser.uid, 'conversations', convoId);
        const snap = await getDoc(convoRef);
        if (!snap.exists()) return;

        const data = snap.data();
        const messages = data.messages || [];
        if (messages.length === 0) return;

        currentConversationId = convoId;
        messagePairCount = Math.floor(messages.length / 2);

        if (!hasMovedToBottom) {
            inputWrapper.classList.add('moved-to-bottom');
            hasMovedToBottom = true;
            enterChatMode();
        }

        messages.forEach(msg => {
            if (msg.role === 'user') {
                appendUserMessage(msg.content, []);
            } else if (msg.type === 'image') {
                appendAIImageMessage(msg.content);
            } else {
                appendAIMessage(msg.content, true, false);
            }
        });
    } catch (err) {
        console.error('Failed to load conversation from history:', err);
    }
}

function getConversationId() {
    if (!currentConversationId) {
        currentConversationId = 'conv_' + Date.now();
    }
    return currentConversationId;
}

// Builds a short chat title from the first user message
function buildChatTitle(text) {
    const trimmed = text.trim().replace(/\s+/g, ' ');
    const MAX_LEN = 60;
    return trimmed.length > MAX_LEN ? trimmed.slice(0, MAX_LEN).trimEnd() + '…' : trimmed;
}

// Saves one user+AI message pair to Firestore under this user's account.
// After the 2nd exchange, also sets a title for this conversation
// (derived from the first message), so it can show up in Chat History.
window.saveMessagePairToFirestore = async function(userText, aiText, aiType) {
    if (!currentUser) return; // not logged in — skip saving

    const convoId = getConversationId();
    const convoRef = doc(db, 'users', currentUser.uid, 'conversations', convoId);

    messagePairCount++;

    const updateData = {
        updatedAt: serverTimestamp(),
        messages: arrayUnion(
            { role: 'user', content: userText, at: Date.now() },
            { role: 'assistant', content: aiText, at: Date.now(), type: aiType || 'text' }
        )
    };

    // First exchange: mark the title as "being decided" so History can
    // show a shimmer, then generate the real title in the background.
    if (messagePairCount === 1) {
        updateData.titlePending = true;
    }

    try {
        await setDoc(convoRef, updateData, { merge: true });
    } catch (err) {
        console.error('Failed to save chat to Firestore:', err);
    }

    if (messagePairCount === 1) {
        const aiTextForTitle = (aiType === 'image') ? '[Generated an image]' : aiText;
        generateAndSaveTitle(convoRef, userText, aiTextForTitle);
    }
};

// Asks the AI to name the chat based on the first exchange, then saves
// the result. Falls back to a truncated version of the user's message
// if the request fails for any reason.
async function generateAndSaveTitle(convoRef, userText, aiText) {
    try {
        const res = await fetch('/api/generate-title', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_message: userText, ai_message: aiText })
        });
        const data = await res.json();
        const title = (data.title || '').trim();

        await setDoc(convoRef, {
            title: title || buildChatTitle(userText),
            titlePending: false
        }, { merge: true });
    } catch (err) {
        console.error('Title generation failed, using fallback:', err);
        try {
            await setDoc(convoRef, {
                title: buildChatTitle(userText),
                titlePending: false
            }, { merge: true });
        } catch (e2) {}
    }

    enforceHistoryLimitIfNeeded();
}

const FREE_HISTORY_LIMIT = 8;

async function enforceHistoryLimitIfNeeded() {
    if (!currentUser) return;
    if (currentPlan && currentPlan !== 'free') return; // only enforced on the free plan

    try {
        const convosRef = collection(db, 'users', currentUser.uid, 'conversations');
        const snap = await getDocs(convosRef);

        const titled = [];
        snap.forEach(docSnap => {
            const data = docSnap.data();
            if (data.title) {
                titled.push({
                    id: docSnap.id,
                    updatedAt: data.updatedAt,
                    pinned: !!data.pinned
                });
            }
        });

        if (titled.length <= FREE_HISTORY_LIMIT) return;

        // Oldest first, so the earliest conversations get removed
        titled.sort((a, b) => {
            const aTime = a.updatedAt?.toMillis ? a.updatedAt.toMillis() : 0;
            const bTime = b.updatedAt?.toMillis ? b.updatedAt.toMillis() : 0;
            return aTime - bTime;
        });

        const excess = titled.length - FREE_HISTORY_LIMIT;
        // Pinned chats are protected from auto-deletion
        const toDelete = titled.filter(c => !c.pinned).slice(0, excess);

        for (const chat of toDelete) {
            await deleteDoc(doc(db, 'users', currentUser.uid, 'conversations', chat.id));
        }

        if (toDelete.length > 0 && window.showHistoryLimitPopup) {
            window.showHistoryLimitPopup();
        }
    } catch (err) {
        console.error('Failed to enforce chat history limit:', err);
    }
}
/* ---------- SHARE CHAT ---------- */

function showShareToast(message, isError) {
    let toast = document.getElementById('share-toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'share-toast';
        document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.style.color = isError ? '#f87171' : '#f0f0f0';
    toast.style.borderColor = isError ? 'rgba(239,68,68,0.4)' : '#333';
    requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
    });
    clearTimeout(toast._hideTimer);
    toast._hideTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(10px)';
    }, 2200);
}

// Copies a conversation into the public sharedChats collection and
// puts a shareable link on the clipboard. Works for the active chat
// (via chatShareCurrent) or any chat by id (via chatShareById, used
// by the History popup's "Share chat" menu option).
window.shareConversation = async function(chatId) {
    if (!currentUser || !chatId) {
        showShareToast('Nothing to share yet.', true);
        return;
    }
    try {
        const convoSnap = await getDoc(doc(db, 'users', currentUser.uid, 'conversations', chatId));
        if (!convoSnap.exists()) {
            showShareToast('Chat not found.', true);
            return;
        }
        const data = convoSnap.data();
        const messages = data.messages || [];
        if (messages.length === 0) {
            showShareToast('Nothing to share yet.', true);
            return;
        }

        const shareId = crypto.randomUUID
            ? crypto.randomUUID()
            : 'share_' + Date.now() + '_' + Math.random().toString(36).slice(2);

        await setDoc(doc(db, 'sharedChats', shareId), {
            title: data.title || 'Shared conversation',
            messages: messages,
            createdAt: serverTimestamp(),
            ownerId: currentUser.uid
        });

        const link = window.location.origin + '/share/' + shareId;
        const title = data.title || 'Shared conversation';

        if (window.openShareModal) {
            window.openShareModal(link, title);
        } else {
            // fallback in case the modal component isn't loaded on this page
            await navigator.clipboard.writeText(link);
            showShareToast('Link copied to clipboard!');
        }
    } catch (err) {
        console.error('Failed to share chat:', err);
        showShareToast('Failed to create share link.', true);
    }
};

// Shares whichever conversation is currently open in the chat window
window.shareCurrentChat = function() {
    if (!currentConversationId) {
        showShareToast('Send a message first.', true);
        return;
    }
    window.shareConversation(currentConversationId);
};
</script>
